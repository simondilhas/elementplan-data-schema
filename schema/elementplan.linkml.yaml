slots:
  id:
    identifier: true
    required: true
  de:
    range: string
  fr:
    range: string
  it:
    range: string
  en:
    range: string
  code:
    range: string
  sort_order:
    range: integer
  status:
    range: StatusEnum

  jurisdiction:
    multivalued: true
    range: JurisdictionEnum
    description: >-
      Geographic applicability. Use [general] when not country-specific;
      otherwise one or more ISO 3166-1 alpha-2 codes (lowercase), e.g.
      [ch] or [ch, de, at]. Do not mix general with country codes. Omit
      to mean [general].
  name:
    required: true
    range: LocalizedText
  definition:
    range: LocalizedText
  description:
    range: LocalizedText
  file_name:
    range: LocalizedText
  picture_link:
    range: string
    description: >-
      Filename of a screen/web preview image under media/pictures/
      (e.g. PNG or JPEG).
  picture_print_link:
    range: string
    description: >-
      Filename of a print-quality image under media/pictures/
      (e.g. TIFF), distinct from picture_link.
  attachment_link:
    range: string
    description: >-
      Filename of a downloadable attachment under media/attachments/
      (PDF, IFC, or other allowed model formats). Legacy YAML may still
      use model_link; readers should accept both and write attachment_link.
  applicability:
    range: Any
    any_of:
      - range: string
      - range: LocalizedText
    description: >-
      Filter expression identifying the element within its IFC entity. A plain
      string when the expression is language-neutral; a LocalizedText when it
      contains a localised literal (e.g. ObjectType or LongName tokens that
      differ per language).
  comment:
    range: string
  source:
    range: string
    description: >-
      Source id or code in a mapping (Phase id on PhaseMapping; phase or
      milestone code on PhaseMapEntry).
  target:
    range: string
    description: >-
      Target id or code in a mapping (Phase id on PhaseMapping; phase or
      milestone code on PhaseMapEntry).
  phase_mappings:
    multivalued: true
    range: PhaseMapping
    inlined_as_list: true
    description: >-
      Approximate equivalence maps between pickable Phase catalogs (e.g. SIA →
      abstract), used for display and phase picker translation.
  workflow_group:
    range: string
  service_kind:
    range: ServiceKindEnum
    description: >-
      Whether this workflow is a Grundleistung (basic) or a besondere Leistung
      (special). Omit when not yet classified.
  parent_workflow:
    range: Workflow
    inlined: false
  year:
    range: integer
  norm_reference:
    range: string
  values:
    multivalued: true
    range: string
  needed_in_domain:
    multivalued: true
    range: Domain
    inlined: false
  needed_in_models:
    multivalued: true
    range: Model
    inlined: false
    description: >-
      Containers (Teilmodelle and documents) this element is assigned to in
      the Information Delivery Plan. Range is Model in LinkML; Document IDs
      are also valid.
  needed_for_models:
    range: ContainerPhaseMap
    inlined: true
    description: >-
      Project-specific IDP override: mapping of container id (Model or
      Document) to a list of phase ids. Missing key → pretags from that
      container's included_elements (all phases that have an information
      requirement). Explicit empty list means the user cleared pretags.
  included_elements:
    multivalued: true
    range: Element
    inlined: false
    description: >-
      Template/default element set for this model or document. The Information
      Delivery Plan pretags these elements until a project-specific
      needed_for_models override exists.
  scheduled_milestones:
    multivalued: true
    range: Milestone
    inlined: false
    description: >-
      Milestone IDs at which this model or document is scheduled for delivery.
      Omit the field or use an empty list if unscheduled. Not an inlined
      milestones block; values are catalog ids such as "11:B".
  kind:
    range: MilestoneKindEnum
  date:
    range: date
    description: Optional calendar date of this delivery moment.
  entity_ifc2x3:
    range: string
  entity_ifc4:
    range: string
  entity_ifc4_3:
    range: string
  attributes:
    multivalued: true
    range: Attribute
    inlined_as_list: true
  custom_psets:
    multivalued: true
    range: CustomPset
    inlined: false
  pset:
    range: string
  datatype:
    range: IFCDatatypeEnum
  unit:
    range: string
    description: Optional unit for measure datatypes (e.g. mm, m², kg).
  allowed_values:
    range: ValueSet
    inlined: false
    description: Optional reference to a ValueSet for enumerated constraints.
  regex:
    range: Any
    any_of:
      - range: string
      - range: LocalizedText
    description: >-
      Optional regex pattern for free-text validation when ValueSet is not used.
      A plain string when the pattern is language-neutral; a LocalizedText when
      patterns differ per language. Legacy YAML may use an empty LocalizedText
      for "no pattern"; treat that as omitted.
  link_uid:
    range: string
    description: >-
      Optional editor/import identifier on an Attribute (legacy YAML). Not used
      by the Information Delivery Plan.
  ifc_versions:
    multivalued: true
    range: IFCVersionEnum
  needed_for_workflows:
    multivalued: true
    range: Workflow
    inlined: false
  is_applicability:
    range: boolean
  domains:
    multivalued: true
    range: Domain
    inlined_as_list: true
  domain:
    range: Domain
    inlined: false
    description: Parent domain of a model (Teilmodell) or document.
  models:
    multivalued: true
    range: Model
    inlined_as_list: true
    description: >-
      Optional models (Teilmodelle) under a domain. May be predefined in master
      templates and inherited or extended by projects.
  documents:
    multivalued: true
    range: Document
    inlined_as_list: true
    description: >-
      Optional documents under a domain (non-IFC containers, e.g. a 2D plan).
      May be predefined in master templates and inherited or extended by
      projects.
  project_goals:
    multivalued: true
    range: ProjectGoal
    inlined_as_list: true
  use:
    range: Use
    inlined: false
    description: >-
      Use (Nutzung) this record belongs to, e.g. Wohnen or Flughafen. One
      building can hold several uses.
  uses:
    multivalued: true
    range: Use
    inlined_as_list: true
    description: >-
      Uses (Nutzungen) such as Wohnen, Büro, or Flughafen. Unit types and
      usage scenarios belong to one use.
  unit_types:
    multivalued: true
    range: UnitType
    inlined_as_list: true
    description: >-
      Unit types such as Wohnung: containers with their own gross area and
      volume that hold rooms.
  unit_type:
    range: UnitType
    inlined: false
    description: >-
      Unit type whose units hold the rooms this option produces (e.g.
      Wohnung). Omit when the rooms sit directly in the building.
  parent_unit_type:
    range: UnitType
    inlined: false
    description: Enclosing unit type when units nest. Omit for top-level units.
  variants:
    multivalued: true
    range: UnitVariant
    inlined_as_list: true
    description: >-
      Standard variants of this unit type shipped with the catalog (e.g.
      Wohnung 3.5 Zi), in order.
  unit_rooms:
    multivalued: true
    range: UnitRoom
    inlined_as_list: true
    description: Rooms of this standard variant, each with its count.
  unit_variants:
    multivalued: true
    range: UnitVariant
    inlined: false
    description: >-
      Standard unit variants this record produces or activates: on an
      option, the variants it brings; on a goal level, the complete set of
      variants that level activates (e.g. a Wohnungsmix level). Counts per
      variant live in the app.
  is_boundary_condition:
    range: boolean
    description: >-
      True when the goal sets a boundary condition (Rahmenbedingung), such as
      the Wohnungsmix, rather than an information goal. Omit or false for
      regular goals.
  exclusive:
    range: boolean
    description: >-
      True when choosing this option excludes every other option of the
      same scenario (e.g. "kein"). Omit or false otherwise.
  excludes:
    multivalued: true
    inlined: false
    any_of:
      - range: ScenarioOption
      - range: UnitVariant
    description: >-
      Options or unit variants that cannot be chosen together with this
      option, in any scenario or boundary condition. Symmetric: declare the
      rule on one side only; the app reads it in both directions.
  count:
    range: integer
    minimum_value: 1
    description: Number of rooms of this room type in one unit of the variant.
  allows_multiple:
    range: boolean
    description: >-
      True when several options of this scenario can be chosen together.
      Exclusive options still exclude the others. Omit or false for a
      single choice.
  required_room_types:
    multivalued: true
    range: RoomType
    inlined: false
    description: >-
      Room types this option produces, in display order. They are the
      consequence of choosing the option. The same room type may be
      required by several options.
  sizes:
    multivalued: true
    range: OptionSize
    inlined_as_list: true
    description: >-
      Ordered sizes of this option (e.g. small, medium, large), ordinal via
      sort_order. Omit when the option has no size scale.
  size_restrictions:
    multivalued: true
    range: SizeRestriction
    inlined_as_list: true
    description: >-
      Minimum sizes this size sets on room types the option produces.
  room_type:
    range: RoomType
    inlined: false
    description: Room type a size restriction or unit room refers to.
  from_room_type:
    range: RoomType
    inlined: false
    description: Start node of a directed room relationship on a usage scenario.
  to_room_type:
    range: RoomType
    inlined: false
    description: End node of a directed room relationship on a usage scenario.
  room_relationships:
    multivalued: true
    range: RoomRelationship
    inlined_as_list: true
    description: >-
      Directed edges between room types for this option. The room types
      are the nodes; each relationship is one edge of that option's graph.
      The same room type may have different neighbors in another option.
  options:
    multivalued: true
    range: ScenarioOption
    inlined_as_list: true
    description: >-
      Alternative ways to meet this scenario's need. Each option names
      the room types or unit variants it produces and the edges between
      them.
  restrictions:
    range: RoomTypeRestriction
    inlined: true
    description: >-
      Minimum size of this room type. Omit the object, or any measure inside
      it, when that limit is not set.
  min_area:
    range: float
    description: Minimum floor area (size) in square metres.
  min_height:
    range: float
    description: Minimum clear height in metres.
  min_length:
    range: float
    description: Minimum clear length in metres.
  min_width:
    range: float
    description: Minimum clear width in metres.
  max_distance:
    range: float
    description: >-
      Maximum distance in metres between the two room types of this edge.
      Omit when the link has no distance limit.
  room_types:
    multivalued: true
    range: RoomType
    inlined_as_list: true
    description: >-
      Functional room types a usage scenario can require. Distinct from
      ValueSet room lists used as IFC Reference vocabularies.
  usage_scenarios:
    multivalued: true
    range: UsageScenario
    inlined_as_list: true
    description: >-
      Usage scenarios (Nutzungsszenarien): one need of a use each, with the
      options that meet it.
  element:
    range: Element
    inlined: false
    description: >-
      Element whose attribute a room-type preset sets (e.g. Innenraum for
      IfcSpace).
  value:
    range: Any
    any_of:
      - range: string
      - range: boolean
      - range: integer
      - range: float
      - range: LocalizedText
    description: >-
      Preset value for one element attribute on a room type. A string for
      enumerations such as PredefinedType (INTERNAL), a number or boolean for
      measures and flags, or a LocalizedText when the attribute text differs
      per language (e.g. LongName).
  attribute_presets:
    multivalued: true
    range: AttributePreset
    inlined_as_list: true
    description: >-
      Values fixed for element attributes when this room type is used. Omit
      attributes that stay open on each room instance.
  levels:
    multivalued: true
    range: ProjectGoalLevel
    inlined_as_list: true
    description: Ordered Ausprägungen of a project goal (ordinal via sort_order).
  activated_workflows:
    multivalued: true
    range: Workflow
    inlined: false
    description: >-
      Complete set of workflows activated when this goal level is selected.
      Higher levels list lower-level workflows explicitly (copied on save).
  workflows:
    multivalued: true
    range: Workflow
    inlined_as_list: true
  valuesets:
    multivalued: true
    range: ValueSet
    inlined_as_list: true
  elements:
    multivalued: true
    range: Element
    inlined_as_list: true
  custom_pset_entities:
    multivalued: true
    range: CustomPset
    inlined_as_list: true
  phase_schemes:
    multivalued: true
    range: PhaseScheme
    inlined_as_list: true
  phases:
    multivalued: true
    range: Phase
    inlined_as_list: true
  phase_subphases:
    multivalued: true
    range: PhaseSubphase
    inlined_as_list: true
  milestones:
    multivalued: true
    range: Milestone
    inlined_as_list: true
    description: >-
      Delivery moments that belong to a Phase (B/M/E of a phase code).
      Referenced from Model and Document via scheduled_milestones ids.
  scheme:
    range: PhaseScheme
    inlined: false
  phase:
    range: Phase
    inlined: false
  subphases:
    multivalued: true
    range: PhaseSubphase
    inlined: false
  needed_in_phases:
    multivalued: true
    range: string

  classification_scheme:
    range: string
    required: true
    description: >-
      Identifier of the classification scheme, matching the dcterms:identifier
      of the SKOS ConceptScheme published on schema.pragmaticbim.ch (e.g.
      KBOBDocumentTypes2016, DocumentFunctionClassification,
      AbstractModelClassification).
  classification_code:
    range: string
    required: true
    description: Code (skos:notation) of the concept inside the scheme.
  classification_label:
    range: string
    description: Optional human-readable label of the concept.
  classification_uri:
    range: uriorcurie
    description: >-
      Optional URI/CURIE of the concept in an external registry. Namespaces may
      still change; scheme + code are the stable key.
  classification_version:
    range: string
    description: Optional scheme or version identifier.
  classification_source:
    range: string
    description: Source authority or dataset for this classification.
  classifications:
    multivalued: true
    range: Classification
    inlined_as_list: true
    description: >-
      Classification entries from external schemes, e.g.
      KBOBDocumentTypes2016 / V07100 or DocumentFunctionClassification /
      TEC-PLN on a document, AbstractModelClassification / ARC on a model.
      The `code` slot remains the pragmaticBIM-internal container token; do not
      repeat it here.
  metadata_requirements:
    multivalued: true
    range: DocumentRequirement
    inlined_as_list: true
    description: >-
      Structured list of what the document's own metadata must carry (revision
      index, status code, originator). Documents do not carry a content
      requirement list.

classes:
  Any:
    class_uri: linkml:Any
    description: >-
      Placeholder range for a slot that permits more than one shape; the
      accepted shapes are listed in the slot's any_of.

  LocalizedText:
    slots:
      - de
      - fr
      - it
      - en
    slot_usage:
      de:
        required: true

  LocalizedStringList:
    slots:
      - de
      - fr
      - it
      - en
    slot_usage:
      de:
        required: true
        multivalued: true
      fr:
        multivalued: true
      it:
        multivalued: true
      en:
        multivalued: true

  ContainerPhaseMap:
    class_uri: linkml:Any
    description: >-
      Mapping of container id (Model or Document) to a list of phase ids.

  Classification:
    description: >-
      Generic classification entry from an external scheme (KBOB document
      types, document function, abstract model classification).
      Same slot names as the pragmatic BIM data contract Classification class so
      records round-trip between both schemas. Vocabularies are the SKOS files
      published on schema.pragmaticbim.ch; this schema stores scheme + code only.
    slots:
      - classification_scheme
      - classification_code
      - classification_label
      - classification_uri
      - classification_version
      - classification_source

  DocumentRequirement:
    description: >-
      One metadata item the document file must carry (metadata_requirements).
      The document analog of an Element Attribute: needed_in_phases states when
      the item is required, needed_for_workflows justifies it via the goal →
      workflow → requirement chain. No IFC datatype or ifc_versions, and no
      content-requirement list.
    slots:
      - name
      - sort_order
      - definition
      - allowed_values
      - regex
      - needed_in_phases
      - needed_for_workflows
      - status
      - jurisdiction
    slot_usage:
      name:
        required: true
      needed_in_phases:
        required: true
        minimum_cardinality: 1

  ElementplanDataset:
    tree_root: true
    slots:
      - domains
      - models
      - documents
      - project_goals
      - uses
      - unit_types
      - room_types
      - usage_scenarios
      - workflows
      - valuesets
      - phase_schemes
      - phases
      - phase_mappings
      - phase_subphases
      - custom_pset_entities
      - elements

  Domain:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - file_name
      - status

  Model:
    description: >-
      Model (Teilmodell) within a domain, e.g. Room model or Facade model under
      Architecture. Optional; may be predefined in master templates and inherited
      or extended by projects. Same slots as Domain, plus a required link to the
      parent domain, an optional included_elements pre-tag list, optional
      scheduled_milestones (catalog ids of delivery moments), optional external
      classifications (e.g. AbstractModelClassification). No content
      requirements and no role assignments (audience, reviewer, responsible
      party, or approver).
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - file_name
      - status
      - jurisdiction
      - domain
      - included_elements
      - scheduled_milestones
      - classifications
    slot_usage:
      domain:
        required: true

  Document:
    description: >-
      Document within a domain (non-IFC container, e.g. a 2D plan). Optional;
      may be predefined in master templates and inherited or extended by
      projects. Same slots as Domain, plus a required link to the parent domain,
      an optional included_elements pre-tag list, optional scheduled_milestones
      (catalog ids of delivery moments), and optional description (distinct
      from definition). Optional external classifications
      (KBOBDocumentTypes2016, DocumentFunctionClassification) and
      metadata_requirements whose items link to phases and workflows. No
      content requirements and no role assignments (audience, reviewer,
      responsible party, or approver).
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - description
      - file_name
      - status
      - jurisdiction
      - domain
      - included_elements
      - scheduled_milestones
      - classifications
      - metadata_requirements
    slot_usage:
      domain:
        required: true
      description:
        description: >-
          Short notes on the document, for LLM completeness/fit checks.
          Distinct from definition (catalog purpose). Not a content-requirement
          list.

  AttributePreset:
    description: >-
      One preset value for an attribute of an element, applied when a room
      type is used. element + name (+ pset) identify the attribute on the
      element catalog, the same way an Attribute is named on IfcSpace
      (Innenraum). When that attribute has allowed_values, value should be
      one of those entries.
    slots:
      - element
      - name
      - pset
      - value
    slot_usage:
      element:
        required: true
      name:
        required: true
        range: string
        description: >-
          IFC property or attribute name, matching Attribute.name on the
          referenced element (e.g. PredefinedType, LongName, IsExternal).

  RoomType:
    description: >-
      Functional space a usage scenario can require (e.g. Check-in-Halle).
      Distinct from ValueSet room lists (raumliste-innen / raumliste-aussen)
      used as IFC Reference vocabularies on elements such as Innenraum.
      attribute_presets sets values for attributes of that element, such as
      IfcSpace PredefinedType. restrictions sets the minimum size: floor
      area, clear height, length, and width.
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - status
      - attribute_presets
      - restrictions

  RoomTypeRestriction:
    description: >-
      Minimum size of a room type, unit type, or unit variant (gross values
      for units). min_area is the floor area (size) in square metres. min_height, min_length, and min_width are clear
      dimensions in metres. Every measure is optional.
    slots:
      - min_area
      - min_height
      - min_length
      - min_width

  RoomRelationship:
    description: >-
      One directed edge of an option's room graph. from_room_type and
      to_room_type are the nodes. Optional name labels the edge (e.g. Zugang);
      omit it when the edge is only the link. max_distance is the maximum
      distance in metres between the two room types. Inlined on the option, so it
      has no id of its own. Either end may be a room type that is not also
      listed in required_room_types (e.g. the living room a balcony is
      reached from).
    slots:
      - from_room_type
      - to_room_type
      - name
      - max_distance
    slot_usage:
      from_room_type:
        required: true
      to_room_type:
        required: true
      name:
        required: false
        description: >-
          Optional label for this edge (e.g. Zugang). Omit when the edge is
          only the link.

  Use:
    description: >-
      Use (Nutzung) such as Wohnen, Büro, or Flughafen. One building can hold
      several uses. Unit types and usage scenarios belong to one use.
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - status

  UnitType:
    description: >-
      Container with its own gross area and volume that holds rooms, e.g. a
      Wohnung (in IFC usually an IfcZone grouping IfcSpaces). restrictions
      are gross values. parent_unit_type is set when units nest. variants
      are the standard variants shipped with the catalog.
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - use
      - parent_unit_type
      - attribute_presets
      - restrictions
      - status
      - variants
    slot_usage:
      use:
        required: true
      restrictions:
        description: >-
          Minimum gross size of this unit type. Omit the object, or any
          measure inside it, when that limit is not set.

  UnitVariant:
    description: >-
      Standard variant of a unit type (e.g. Wohnung 3.5 Zi). unit_rooms are
      the rooms of one unit with their counts; that is the definition of the
      variant, not a project quantity. How many units a project orders lives
      in the app.
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - restrictions
      - unit_rooms
    slot_usage:
      restrictions:
        description: >-
          Minimum gross size of this variant. Omit the object, or any measure
          inside it, when that limit is not set.

  UnitRoom:
    description: One room type of a unit variant and how many of it one unit has.
    slots:
      - room_type
      - count
    slot_usage:
      room_type:
        required: true
      count:
        required: true

  SizeRestriction:
    description: >-
      Minimum size an option size sets on one room type the option
      produces. Every measure is optional; same units as RoomTypeRestriction.
    slots:
      - room_type
      - min_area
      - min_height
      - min_length
      - min_width
    slot_usage:
      room_type:
        required: true

  OptionSize:
    description: >-
      Ordered size of an option (e.g. small, medium, large); sort_order is
      the ordinal. size_restrictions name the room type they apply to,
      because an option can produce several rooms. The size question is
      asked when the chosen option has sizes.
    slots:
      - id
      - sort_order
      - name
      - description
      - size_restrictions

  ScenarioOption:
    description: >-
      One way to meet a scenario's need. required_room_types and
      unit_variants are what it produces; room_relationships are the
      directed edges between rooms. unit_type is the container the rooms go
      into (omit for the building). exclusive marks an option that excludes
      every other option of its scenario, such as "kein" (no room types and
      no unit variants), which also makes the scenario optional. excludes
      names options or unit variants elsewhere that cannot be combined with
      this one; the rule is symmetric and declared on one side.
    slots:
      - id
      - sort_order
      - name
      - description
      - unit_type
      - sizes
      - required_room_types
      - unit_variants
      - room_relationships
      - exclusive
      - excludes

  UsageScenario:
    description: >-
      Nutzungsszenario: one need of a use (e.g. Wohnen mit Aussenbezug) and
      the options that meet it. A scenario with a "kein" option (exclusive,
      producing nothing) is optional; one without is mandatory. One option
      is chosen unless allows_multiple is true; with a single option and no
      "kein", the question is skipped. Choices, counts, and the programme tree live in
      the app. Distinct from Workflow Szenarienentwicklung, which is urban
      design variants.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - use
      - status
      - jurisdiction
      - allows_multiple
      - options
    slot_usage:
      use:
        required: true

  ProjectGoal:
    description: >-
      Why information is needed, with ordered levels (Ausprägungen).
      is_boundary_condition marks a goal that sets a boundary condition
      (Rahmenbedingung) instead, such as the Wohnungsmix; its levels then
      activate unit_variants rather than (or besides) workflows.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - picture_link
      - status
      - comment
      - is_boundary_condition
      - levels

  ProjectGoalLevel:
    description: >-
      Ausprägung (ordered level) of a project goal. sort_order orders the scale
      and is used to copy lower-level workflows onto higher levels. activated_workflows
      is the complete Goal × Level → Workflow set for this level. On a
      boundary-condition goal, unit_variants is the complete set of unit
      variants the level activates; activated_workflows may then be empty.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - status
      - activated_workflows
      - unit_variants
      - comment

  Workflow:
    description: >-
      A BIM use case (Anwendungsfall). service_kind marks it as a Grundleistung
      (basic) or a besondere Leistung (special) when that distinction is known.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - workflow_group
      - service_kind
      - parent_workflow
      - picture_link
      - status
      - jurisdiction
      - needed_in_domain
      - comment

  ValueSet:
    slots:
      - id
      - code
      - name
      - description
      - year
      - norm_reference
      - status
      - values
    slot_usage:
      values:
        range: LocalizedStringList
        multivalued: false

  PhaseScheme:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - status

  Phase:
    description: >-
      A pickable phase catalog (e.g. SIA or abstract) with ordered phase codes
      in values. Milestones (B/M/E moments) are part of the phase, not a
      separate catalog. Multiple Phase catalogs may coexist; PhaseMapping
      relates them for display and phase picker translation.
    slots:
      - id
      - name
      - values
      - milestones

  PhaseMapEntry:
    description: >-
      One source→target code pair inside a PhaseMapping (phase code or
      milestone id).
    slots:
      - source
      - target
    slot_usage:
      source:
        required: true
      target:
        required: true

  PhaseMapping:
    description: >-
      Approximate equivalence between two Phase catalogs (e.g. SIA → abstract)
      for display and phase picker. `phases` maps phase codes; `milestones`
      maps milestone ids. Unmapped codes (e.g. Demolish) have no counterpart.
    slots:
      - id
      - source
      - target
      - status
      - name
      - comment
      - phases
      - milestones
    slot_usage:
      source:
        range: Phase
        required: true
        inlined: false
      target:
        range: Phase
        required: true
        inlined: false
      comment:
        range: LocalizedText
      phases:
        range: PhaseMapEntry
        multivalued: true
        inlined_as_list: true
      milestones:
        range: PhaseMapEntry
        multivalued: true
        inlined_as_list: true

  PhaseSubphase:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - status
      - phase

  Milestone:
    description: >-
      A delivery moment that belongs to a Phase (B beginning, M mid, or E end
      of a phase code). Referenced from Model and Document via
      scheduled_milestones ids; not inlined inside model or document YAML.
    slots:
      - id
      - code
      - sort_order
      - name
      - status
      - phase
      - kind
      - date
    slot_usage:
      phase:
        range: string
        required: true
      kind:
        required: true

  CustomPset:
    slots:
      - id
      - code
      - name
      - attributes
    slot_usage:
      attributes:
        required: true
        minimum_cardinality: 1

  Element:
    slots:
      - id
      - code
      - sort_order
      - status
      - name
      - definition
      - needed_in_domain
      - needed_in_models
      - needed_for_models
      - entity_ifc2x3
      - entity_ifc4
      - entity_ifc4_3
      - picture_link
      - picture_print_link
      - attachment_link
      - applicability
      - custom_psets
      - attributes

  Attribute:
    slots:
      - name
      - sort_order
      - pset
      - definition
      - datatype
      - unit
      - allowed_values
      - regex
      - needed_in_phases
      - ifc_versions
      - needed_for_workflows
      - is_applicability
      - status
      - jurisdiction
      - link_uid
    slot_usage:
      name:
        required: true
        range: string
        description: IFC property or attribute name (not a localized catalog title).
      ifc_versions:
        required: true
        minimum_cardinality: 1
      needed_in_phases:
        required: true
        minimum_cardinality: 1
