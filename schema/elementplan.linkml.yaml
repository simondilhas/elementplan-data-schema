slots:
  id:
    identifier: true
    required: true
  de:
    range: string
  fr:
    range: string
  it:
    range: string
  en:
    range: string
  code:
    range: string
  sort_order:
    range: integer
  status:
    range: StatusEnum

  jurisdiction:
    multivalued: true
    range: JurisdictionEnum
    description: >-
      Geographic applicability. Use [general] when not country-specific;
      otherwise one or more ISO 3166-1 alpha-2 codes (lowercase), e.g.
      [ch] or [ch, de, at]. Do not mix general with country codes. Omit
      to mean [general].
  name:
    required: true
    range: LocalizedText
  definition:
    range: LocalizedText
  description:
    range: LocalizedText
  file_name:
    range: LocalizedText
  picture_link:
    range: string
    description: >-
      Filename of a screen/web preview image under media/pictures/
      (e.g. PNG or JPEG).
  picture_print_link:
    range: string
    description: >-
      Filename of a print-quality image under media/pictures/
      (e.g. TIFF), distinct from picture_link.
  attachment_link:
    range: string
    description: >-
      Filename of a downloadable attachment under media/attachments/
      (PDF, IFC, or other allowed model formats). Legacy YAML may still
      use model_link; readers should accept both and write attachment_link.
  applicability:
    range: Any
    any_of:
      - range: string
      - range: LocalizedText
    description: >-
      Filter expression identifying the element within its IFC entity. A plain
      string when the expression is language-neutral; a LocalizedText when it
      contains a localised literal (e.g. ObjectType or LongName tokens that
      differ per language).
  comment:
    range: string
  source:
    range: string
    description: >-
      Source id or code in a mapping (Phase id on PhaseMapping; phase or
      milestone code on PhaseMapEntry).
  target:
    range: string
    description: >-
      Target id or code in a mapping (Phase id on PhaseMapping; phase or
      milestone code on PhaseMapEntry).
  phase_mappings:
    multivalued: true
    range: PhaseMapping
    inlined_as_list: true
    description: >-
      Approximate equivalence maps between pickable Phase catalogs (e.g. SIA →
      abstract), used for display and phase picker translation.
  workflow_group:
    range: string
  service_kind:
    range: ServiceKindEnum
    description: >-
      Whether this workflow is a Grundleistung (basic) or a besondere Leistung
      (special). Omit when not yet classified.
  parent_workflow:
    range: Workflow
    inlined: false
  year:
    range: integer
  norm_reference:
    range: string
  values:
    multivalued: true
    range: string
  needed_in_domain:
    multivalued: true
    range: Domain
    inlined: false
  needed_in_models:
    multivalued: true
    range: Model
    inlined: false
    description: >-
      Containers (Teilmodelle and documents) this element is assigned to in
      the Information Delivery Plan. Range is Model in LinkML; Document IDs
      are also valid.
  needed_for_models:
    range: ContainerPhaseMap
    inlined: true
    description: >-
      Project-specific IDP override: mapping of container id (Model or
      Document) to a list of phase ids. Missing key → pretags from that
      container's included_elements (all phases that have an information
      requirement). Explicit empty list means the user cleared pretags.
  included_elements:
    multivalued: true
    range: Element
    inlined: false
    description: >-
      Template/default element set for this model or document. The Information
      Delivery Plan pretags these elements until a project-specific
      needed_for_models override exists.
  scheduled_milestones:
    multivalued: true
    range: Milestone
    inlined: false
    description: >-
      Milestone IDs at which this model or document is scheduled for delivery.
      Omit the field or use an empty list if unscheduled. Not an inlined
      milestones block; values are catalog ids such as "11:B".
  kind:
    range: MilestoneKindEnum
  date:
    range: date
    description: Optional calendar date of this delivery moment.
  entity_ifc2x3:
    range: string
  entity_ifc4:
    range: string
  entity_ifc4_3:
    range: string
  attributes:
    multivalued: true
    range: Attribute
    inlined_as_list: true
  custom_psets:
    multivalued: true
    range: CustomPset
    inlined: false
  pset:
    range: string
  datatype:
    range: IFCDatatypeEnum
  unit:
    range: string
    description: Optional unit for measure datatypes (e.g. mm, m², kg).
  allowed_values:
    range: ValueSet
    inlined: false
    description: Optional reference to a ValueSet for enumerated constraints.
  regex:
    range: Any
    any_of:
      - range: string
      - range: LocalizedText
    description: >-
      Optional regex pattern for free-text validation when ValueSet is not used.
      A plain string when the pattern is language-neutral; a LocalizedText when
      patterns differ per language. Legacy YAML may use an empty LocalizedText
      for "no pattern"; treat that as omitted.
  link_uid:
    range: string
    description: >-
      Optional editor/import identifier on an Attribute (legacy YAML). Not used
      by the Information Delivery Plan.
  ifc_versions:
    multivalued: true
    range: IFCVersionEnum
  needed_for_workflows:
    multivalued: true
    range: Workflow
    inlined: false
  is_applicability:
    range: boolean
  domains:
    multivalued: true
    range: Domain
    inlined_as_list: true
  domain:
    range: Domain
    inlined: false
    description: Parent domain of a model (Teilmodell) or document.
  models:
    multivalued: true
    range: Model
    inlined_as_list: true
    description: >-
      Optional models (Teilmodelle) under a domain. May be predefined in master
      templates and inherited or extended by projects.
  documents:
    multivalued: true
    range: Document
    inlined_as_list: true
    description: >-
      Optional documents under a domain (non-IFC containers, e.g. a 2D plan).
      May be predefined in master templates and inherited or extended by
      projects.
  project_goals:
    multivalued: true
    range: ProjectGoal
    inlined_as_list: true
  levels:
    multivalued: true
    range: ProjectGoalLevel
    inlined_as_list: true
    description: Ordered Ausprägungen of a project goal (ordinal via sort_order).
  activated_workflows:
    multivalued: true
    range: Workflow
    inlined: false
    description: >-
      Complete set of workflows activated when this goal level is selected.
      Higher levels list lower-level workflows explicitly (copied on save).
  workflows:
    multivalued: true
    range: Workflow
    inlined_as_list: true
  valuesets:
    multivalued: true
    range: ValueSet
    inlined_as_list: true
  elements:
    multivalued: true
    range: Element
    inlined_as_list: true
  custom_pset_entities:
    multivalued: true
    range: CustomPset
    inlined_as_list: true
  phase_schemes:
    multivalued: true
    range: PhaseScheme
    inlined_as_list: true
  phases:
    multivalued: true
    range: Phase
    inlined_as_list: true
  phase_subphases:
    multivalued: true
    range: PhaseSubphase
    inlined_as_list: true
  milestones:
    multivalued: true
    range: Milestone
    inlined_as_list: true
    description: >-
      Delivery moments that belong to a Phase (B/M/E of a phase code).
      Referenced from Model and Document via scheduled_milestones ids.
  scheme:
    range: PhaseScheme
    inlined: false
  phase:
    range: Phase
    inlined: false
  subphases:
    multivalued: true
    range: PhaseSubphase
    inlined: false
  needed_in_phases:
    multivalued: true
    range: string

  classification_scheme:
    range: string
    required: true
    description: >-
      Identifier of the classification scheme, matching the dcterms:identifier
      of the SKOS ConceptScheme published on schema.pragmaticbim.ch (e.g.
      KBOBDocumentTypes2016, DocumentFunctionClassification,
      AbstractModelClassification, AbstractRoles).
  classification_code:
    range: string
    required: true
    description: Code (skos:notation) of the concept inside the scheme.
  classification_label:
    range: string
    description: Optional human-readable label of the concept.
  classification_uri:
    range: uriorcurie
    description: >-
      Optional URI/CURIE of the concept in an external registry. Namespaces may
      still change; scheme + code are the stable key.
  classification_version:
    range: string
    description: Optional scheme or version identifier.
  classification_source:
    range: string
    description: Source authority or dataset for this classification.
  classifications:
    multivalued: true
    range: Classification
    inlined_as_list: true
    description: >-
      Classification entries from external schemes, e.g.
      KBOBDocumentTypes2016 / V07100 or DocumentFunctionClassification /
      TEC-PLN on a document, AbstractModelClassification / ARC on a model.
      The `code` slot remains the pragmaticBIM-internal container token; do not
      repeat it here.
  responsible_role:
    range: Classification
    inlined: true
    description: >-
      Role responsible for producing the container. classification_scheme must
      be AbstractRoles; classification_code is a role id such as aec.architect.
      Template default; projects may override.
  reviewing_roles:
    multivalued: true
    range: Classification
    inlined_as_list: true
    description: >-
      Roles that review or approve the container. classification_scheme must be
      AbstractRoles.
  audience_roles:
    multivalued: true
    range: Classification
    inlined_as_list: true
    description: >-
      Roles that consume the container (readers). classification_scheme must be
      AbstractRoles.
  content_requirements:
    multivalued: true
    range: DocumentRequirement
    inlined_as_list: true
    description: >-
      Structured list of what must be inside the document (legend, scale,
      revision table, report sections). Non-element content, distinct from
      included_elements. Each item carries needed_in_phases and
      needed_for_workflows like an Element attribute.
  metadata_requirements:
    multivalued: true
    range: DocumentRequirement
    inlined_as_list: true
    description: >-
      Structured list of what the document's own metadata must carry (revision
      index, status code, originator). Same item type as content_requirements.

classes:
  Any:
    class_uri: linkml:Any
    description: >-
      Placeholder range for a slot that permits more than one shape; the
      accepted shapes are listed in the slot's any_of.

  LocalizedText:
    slots:
      - de
      - fr
      - it
      - en
    slot_usage:
      de:
        required: true

  LocalizedStringList:
    slots:
      - de
      - fr
      - it
      - en
    slot_usage:
      de:
        required: true
        multivalued: true
      fr:
        multivalued: true
      it:
        multivalued: true
      en:
        multivalued: true

  ContainerPhaseMap:
    class_uri: linkml:Any
    description: >-
      Mapping of container id (Model or Document) to a list of phase ids.

  Classification:
    description: >-
      Generic classification entry from an external scheme (KBOB document
      types, document function, abstract model classification, abstract roles).
      Same slot names as the pragmatic BIM data contract Classification class so
      records round-trip between both schemas. Vocabularies are the SKOS files
      published on schema.pragmaticbim.ch; this schema stores scheme + code only.
    slots:
      - classification_scheme
      - classification_code
      - classification_label
      - classification_uri
      - classification_version
      - classification_source

  DocumentRequirement:
    description: >-
      One required item of a document: either content that must be inside it
      (content_requirements) or metadata the file must carry
      (metadata_requirements). The document analog of an Element Attribute:
      needed_in_phases states when the item is required, needed_for_workflows
      justifies it via the goal → workflow → requirement chain. No IFC datatype
      or ifc_versions.
    slots:
      - name
      - sort_order
      - definition
      - allowed_values
      - regex
      - needed_in_phases
      - needed_for_workflows
      - status
      - jurisdiction
    slot_usage:
      name:
        required: true
      needed_in_phases:
        required: true
        minimum_cardinality: 1

  ElementplanDataset:
    tree_root: true
    slots:
      - domains
      - models
      - documents
      - project_goals
      - workflows
      - valuesets
      - phase_schemes
      - phases
      - phase_mappings
      - phase_subphases
      - custom_pset_entities
      - elements

  Domain:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - file_name
      - status

  Model:
    description: >-
      Model (Teilmodell) within a domain, e.g. Room model or Facade model under
      Architecture. Optional; may be predefined in master templates and inherited
      or extended by projects. Same slots as Domain, plus a required link to the
      parent domain, an optional included_elements pre-tag list, optional
      scheduled_milestones (catalog ids of delivery moments), optional external
      classifications (e.g. AbstractModelClassification), and optional role
      assignments (responsible_role, reviewing_roles, audience_roles).
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - file_name
      - status
      - jurisdiction
      - domain
      - included_elements
      - scheduled_milestones
      - classifications
      - responsible_role
      - reviewing_roles
      - audience_roles
    slot_usage:
      domain:
        required: true

  Document:
    description: >-
      Document within a domain (non-IFC container, e.g. a 2D plan). Optional;
      may be predefined in master templates and inherited or extended by
      projects. Same slots as Domain, plus a required link to the parent domain,
      an optional included_elements pre-tag list, optional scheduled_milestones
      (catalog ids of delivery moments), and optional description (checkable
      content list, distinct from definition). Optional external
      classifications (KBOBDocumentTypes2016, DocumentFunctionClassification),
      role assignments (responsible_role, reviewing_roles, audience_roles), and
      structured requirement lists (content_requirements,
      metadata_requirements) whose items link to phases and workflows.
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - description
      - file_name
      - status
      - jurisdiction
      - domain
      - included_elements
      - scheduled_milestones
      - classifications
      - responsible_role
      - reviewing_roles
      - audience_roles
      - content_requirements
      - metadata_requirements
    slot_usage:
      domain:
        required: true
      description:
        description: >-
          Short checkable list of required document contents, for LLM
          completeness/fit checks. Distinct from definition (catalog purpose).

  ProjectGoal:
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - picture_link
      - status
      - comment
      - levels

  ProjectGoalLevel:
    description: >-
      Ausprägung (ordered level) of a project goal. sort_order orders the scale
      and is used to copy lower-level workflows onto higher levels. activated_workflows
      is the complete Goal × Level → Workflow set for this level.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - status
      - activated_workflows
      - comment

  Workflow:
    description: >-
      A BIM use case (Anwendungsfall). service_kind marks it as a Grundleistung
      (basic) or a besondere Leistung (special) when that distinction is known.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - workflow_group
      - service_kind
      - parent_workflow
      - picture_link
      - status
      - jurisdiction
      - needed_in_domain
      - comment

  ValueSet:
    slots:
      - id
      - code
      - name
      - description
      - year
      - norm_reference
      - status
      - values
    slot_usage:
      values:
        range: LocalizedStringList
        multivalued: false

  PhaseScheme:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - status

  Phase:
    description: >-
      A pickable phase catalog (e.g. SIA or abstract) with ordered phase codes
      in values. Milestones (B/M/E moments) are part of the phase, not a
      separate catalog. Multiple Phase catalogs may coexist; PhaseMapping
      relates them for display and phase picker translation.
    slots:
      - id
      - name
      - values
      - milestones

  PhaseMapEntry:
    description: >-
      One source→target code pair inside a PhaseMapping (phase code or
      milestone id).
    slots:
      - source
      - target
    slot_usage:
      source:
        required: true
      target:
        required: true

  PhaseMapping:
    description: >-
      Approximate equivalence between two Phase catalogs (e.g. SIA → abstract)
      for display and phase picker. `phases` maps phase codes; `milestones`
      maps milestone ids. Unmapped codes (e.g. Demolish) have no counterpart.
    slots:
      - id
      - source
      - target
      - status
      - name
      - comment
      - phases
      - milestones
    slot_usage:
      source:
        range: Phase
        required: true
        inlined: false
      target:
        range: Phase
        required: true
        inlined: false
      comment:
        range: LocalizedText
      phases:
        range: PhaseMapEntry
        multivalued: true
        inlined_as_list: true
      milestones:
        range: PhaseMapEntry
        multivalued: true
        inlined_as_list: true

  PhaseSubphase:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - status
      - phase

  Milestone:
    description: >-
      A delivery moment that belongs to a Phase (B beginning, M mid, or E end
      of a phase code). Referenced from Model and Document via
      scheduled_milestones ids; not inlined inside model or document YAML.
    slots:
      - id
      - code
      - sort_order
      - name
      - status
      - phase
      - kind
      - date
    slot_usage:
      phase:
        range: string
        required: true
      kind:
        required: true

  CustomPset:
    slots:
      - id
      - code
      - name
      - attributes
    slot_usage:
      attributes:
        required: true
        minimum_cardinality: 1

  Element:
    slots:
      - id
      - code
      - sort_order
      - status
      - name
      - definition
      - needed_in_domain
