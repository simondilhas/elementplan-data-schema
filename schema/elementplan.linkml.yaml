slots:
  id:
    identifier: true
    required: true
  de:
    range: string
  fr:
    range: string
  it:
    range: string
  en:
    range: string
  code:
    range: string
  sort_order:
    range: integer
  status:
    range: StatusEnum

  jurisdiction:
    multivalued: true
    range: JurisdictionEnum
    description: >-
      Geographic applicability. Use [general] when not country-specific;
      otherwise one or more ISO 3166-1 alpha-2 codes (lowercase), e.g.
      [ch] or [ch, de, at]. Do not mix general with country codes. Omit
      to mean [general].
  name:
    required: true
    range: LocalizedText
  definition:
    range: LocalizedText
  description:
    range: LocalizedText
  file_name:
    range: LocalizedText
  picture_link:
    range: string
    description: >-
      Filename of a screen/web preview image under media/pictures/
      (e.g. PNG or JPEG).
  picture_print_link:
    range: string
    description: >-
      Filename of a print-quality image under media/pictures/
      (e.g. TIFF), distinct from picture_link.
  attachment_link:
    range: string
    description: >-
      Filename of a downloadable attachment under media/attachments/
      (PDF, IFC, or other allowed model formats). Legacy YAML may still
      use model_link; readers should accept both and write attachment_link.
  applicability:
    range: Any
    any_of:
      - range: string
      - range: LocalizedText
    description: >-
      Filter expression identifying the element within its IFC entity. A plain
      string when the expression is language-neutral; a LocalizedText when it
      contains a localised literal (e.g. ObjectType or LongName tokens that
      differ per language).
  comment:
    range: string
  source:
    range: string
    description: >-
      Source id or code in a mapping (Phase id on PhaseMapping; phase or
      milestone code on PhaseMapEntry).
  target:
    range: string
    description: >-
      Target id or code in a mapping (Phase id on PhaseMapping; phase or
      milestone code on PhaseMapEntry).
  phase_mappings:
    multivalued: true
    range: PhaseMapping
    inlined_as_list: true
    description: >-
      Approximate equivalence maps between pickable Phase catalogs (e.g. SIA →
      abstract), used for display and phase picker translation.
  workflow_group:
    range: string
  service_kind:
    range: ServiceKindEnum
    description: >-
      Whether this workflow is a Grundleistung (basic) or a besondere Leistung
      (special). Omit when not yet classified.
  parent_workflow:
    range: Workflow
    inlined: false
  year:
    range: integer
  norm_reference:
    range: string
  values:
    multivalued: true
    range: string
  needed_in_domain:
    multivalued: true
    range: Domain
    inlined: false
  needed_in_models:
    multivalued: true
    range: Model
    inlined: false
    description: >-
      Containers (Teilmodelle and documents) this element is assigned to in
      the Information Delivery Plan. Range is Model in LinkML; Document IDs
      are also valid.
  needed_for_models:
    range: ContainerPhaseMap
    inlined: true
    description: >-
      Project-specific IDP override: mapping of container id (Model or
      Document) to a list of phase ids. Missing key → pretags from that
      container's included_elements (all phases that have an information
      requirement). Explicit empty list means the user cleared pretags.
  included_elements:
    multivalued: true
    range: Element
    inlined: false
    description: >-
      Template/default element set for this model or document. The Information
      Delivery Plan pretags these elements until a project-specific
      needed_for_models override exists.
  scheduled_milestones:
    multivalued: true
    range: Milestone
    inlined: false
    description: >-
      Milestone IDs at which this model or document is scheduled for delivery.
      Omit the field or use an empty list if unscheduled. Not an inlined
      milestones block; values are catalog ids such as "11:B".
  kind:
    range: MilestoneKindEnum
  date:
    range: date
    description: Optional calendar date of this delivery moment.
  entity_ifc2x3:
    range: string
  entity_ifc4:
    range: string
  entity_ifc4_3:
    range: string
  attributes:
    multivalued: true
    range: Attribute
    inlined_as_list: true
  custom_psets:
    multivalued: true
    range: CustomPset
    inlined: false
  pset:
    range: string
  datatype:
    range: IFCDatatypeEnum
  unit:
    range: string
    description: Optional unit for measure datatypes (e.g. mm, m², kg).
  allowed_values:
    range: ValueSet
    inlined: false
    description: Optional reference to a ValueSet for enumerated constraints.
  regex:
    range: Any
    any_of:
      - range: string
      - range: LocalizedText
    description: >-
      Optional regex pattern for free-text validation when ValueSet is not used.
      A plain string when the pattern is language-neutral; a LocalizedText when
      patterns differ per language. Legacy YAML may use an empty LocalizedText
      for "no pattern"; treat that as omitted.
  link_uid:
    range: string
    description: >-
      Optional editor/import identifier on an Attribute (legacy YAML). Not used
      by the Information Delivery Plan.
  ifc_versions:
    multivalued: true
    range: IFCVersionEnum
  needed_for_workflows:
    multivalued: true
    range: Workflow
    inlined: false
  is_applicability:
    range: boolean
  domains:
    multivalued: true
    range: Domain
    inlined_as_list: true
  domain:
    range: Domain
    inlined: false
    description: Parent domain of a model (Teilmodell) or document.
  models:
    multivalued: true
    range: Model
    inlined_as_list: true
    description: >-
      Optional models (Teilmodelle) under a domain. May be predefined in master
      templates and inherited or extended by projects.
  documents:
    multivalued: true
    range: Document
    inlined_as_list: true
    description: >-
      Optional documents under a domain (non-IFC containers, e.g. a 2D plan).
      May be predefined in master templates and inherited or extended by
      projects.
  project_goals:
    multivalued: true
    range: ProjectGoal
    inlined_as_list: true
  tags:
    multivalued: true
    range: string
    description: >-
      Lightweight labels used to group and filter usage scenarios. Tags have
      no catalog records, hierarchy, or foreign-key semantics.
  room_type_kind:
    range: RoomTypeKindEnum
    description: >-
      Whether a room type is a selectable room or a container composed of
      other room types.
  extends:
    range: RoomType
    inlined: false
    description: >-
      More general room type specialized by this record. This is type
      specialization, not spatial containment.
  contains:
    multivalued: true
    range: RoomTypeComponent
    inlined_as_list: true
    description: Ordered room types composed by a container room type.
  legacy_ids:
    multivalued: true
    range: string
    description: >-
      Previous identifiers accepted as aliases while catalogs and saved
      project selections migrate.
  adds:
    multivalued: true
    range: RoomType
    inlined: false
    description: Room or container types produced by choosing this option.
  activated_room_types:
    multivalued: true
    range: RoomType
    inlined: false
    description: >-
      Complete set of container room types activated by a boundary-condition
      project-goal level.
  is_boundary_condition:
    range: boolean
    description: >-
      True when the goal sets a boundary condition (Rahmenbedingung), such as
      the Wohnungsmix, rather than an information goal. Omit or false for
      regular goals.
  exclusive:
    range: boolean
    description: >-
      True when choosing this option excludes every other option of the
      same scenario (e.g. "kein"). Omit or false otherwise.
  excludes:
    multivalued: true
    inlined: false
    any_of:
      - range: ScenarioOption
      - range: RoomType
    description: >-
      Options or room types that cannot be chosen together with this
      option, in any scenario or boundary condition. Symmetric: declare the
      rule on one side only; the app reads it in both directions.
  allows_multiple:
    range: boolean
    description: >-
      True when several options of this scenario can be chosen together.
      Exclusive options still exclude the others. Omit or false for a
      single choice.
  sizes:
    multivalued: true
    range: OptionSize
    inlined_as_list: true
    description: >-
      Ordered sizes of this option (e.g. small, medium, large), ordinal via
      sort_order. Omit when the option has no size scale.
  size_restrictions:
    multivalued: true
    range: SizeRestriction
    inlined_as_list: true
    description: >-
      Minimum sizes this size sets on room types the option produces.
  room_type:
    range: RoomType
    inlined: false
    description: Room type a size restriction or unit room refers to.
  from_room_type:
    range: RoomType
    inlined: false
    description: Start node of a directed room relationship on a usage scenario.
  to_room_type:
    range: RoomType
    inlined: false
    description: End node of a directed room relationship on a usage scenario.
  room_relationships:
    multivalued: true
    range: RoomRelationship
    inlined_as_list: true
    description: >-
      Directed edges between room types for this option. The room types
      are the nodes; each relationship is one edge of that option's graph.
      The same room type may have different neighbors in another option.
  options:
    multivalued: true
    range: ScenarioOption
    inlined_as_list: true
    description: >-
      Alternative ways to meet this scenario's need. Each option names the
      room types it adds and the edges between them.
  restrictions:
    range: RoomTypeRestriction
    inlined: true
    description: >-
      Minimum size of this room configuration. Omit the object, or any measure
      inside it, when that limit is not set.
  min_area:
    range: float
    description: Minimum floor area (size) in square metres.
  min_height:
    range: float
    description: Minimum clear height in metres.
  min_length:
    range: float
    description: Minimum clear length in metres.
  min_width:
    range: float
    description: Minimum clear width in metres.
  max_distance:
    range: float
    description: >-
      Maximum distance in metres between the two room types of this edge.
      Omit when the link has no distance limit.
  room_types:
    multivalued: true
    range: RoomType
    inlined_as_list: true
    description: >-
      Room and container types in one compositional graph. Distinct from
      external room-name and IFC vocabularies.
  usage_scenarios:
    multivalued: true
    range: UsageScenario
    inlined_as_list: true
    description: >-
      Usage scenarios (Nutzungsszenarien), with inline options that add room
      types. Tags provide lightweight grouping without separate catalogs.
  element:
    range: string
    description: >-
      Opaque external element identifier whose attribute a room-type
      configuration preset sets (e.g. armasuisse:element/innenraum). The
      programme core does not require or inline that external catalog record.
  value:
    range: Any
    any_of:
      - range: string
      - range: boolean
      - range: integer
      - range: float
      - range: LocalizedText
    description: >-
      Preset value for one external element attribute on a room-type
      configuration. A string for enumerations such as PredefinedType (INTERNAL), a
      number or boolean for measures and flags, or a LocalizedText when the
      attribute text differs per language (e.g. LongName).
  attribute_presets:
    multivalued: true
    range: AttributePreset
    inlined_as_list: true
    description: >-
      Complete set of values fixed for element attributes by a room type
      configuration or unit type. Omit attributes that stay open on each
      room or unit instance.
  configurations:
    multivalued: true
    range: RoomTypeConfiguration
    inlined_as_list: true
    description: >-
      Complete, explicit configurations available for this room type. Every
      configuration carries its own attribute presets and restrictions;
      values are never inherited or merged from the room type or another
      configuration.
  levels:
    multivalued: true
    range: ProjectGoalLevel
    inlined_as_list: true
    description: Ordered Ausprägungen of a project goal (ordinal via sort_order).
  project_goal_levels:
    multivalued: true
    range: ProjectGoalLevel
    inlined: false
    description: >-
      Optional project goal levels this room configuration suits. Omit when
      the configuration is not tied to a goal level. A chosen level can then
      select among the configurations of a room type.
  activated_workflows:
    multivalued: true
    range: Workflow
    inlined: false
    description: >-
      Complete set of workflows activated when this goal level is selected.
      Higher levels list lower-level workflows explicitly (copied on save).
  workflows:
    multivalued: true
    range: Workflow
    inlined_as_list: true
  valuesets:
    multivalued: true
    range: ValueSet
    inlined_as_list: true
  elements:
    multivalued: true
    range: Element
    inlined_as_list: true
  custom_pset_entities:
    multivalued: true
    range: CustomPset
    inlined_as_list: true
  phase_schemes:
    multivalued: true
    range: PhaseScheme
    inlined_as_list: true
  phases:
    multivalued: true
    range: Phase
    inlined_as_list: true
  phase_subphases:
    multivalued: true
    range: PhaseSubphase
    inlined_as_list: true
  milestones:
    multivalued: true
    range: Milestone
    inlined_as_list: true
    description: >-
      Delivery moments that belong to a Phase (B/M/E of a phase code).
      Referenced from Model and Document via scheduled_milestones ids.
  scheme:
    range: PhaseScheme
    inlined: false
  phase:
    range: Phase
    inlined: false
  subphases:
    multivalued: true
    range: PhaseSubphase
    inlined: false
  needed_in_phases:
    multivalued: true
    range: string

  classification_scheme:
    range: string
    required: true
    description: >-
      Identifier of the classification scheme, matching the dcterms:identifier
      of the SKOS ConceptScheme published on schema.pragmaticbim.ch (e.g.
      KBOBDocumentTypes2016, DocumentFunctionClassification,
      AbstractModelClassification).
  classification_code:
    range: string
    required: true
    description: Code (skos:notation) of the concept inside the scheme.
  classification_label:
    range: string
    description: Optional human-readable label of the concept.
  classification_uri:
    range: uriorcurie
    description: >-
      Optional URI/CURIE of the concept in an external registry. Namespaces may
      still change; scheme + code are the stable key.
  classification_version:
    range: string
    description: Optional scheme or version identifier.
  classification_source:
    range: string
    description: Source authority or dataset for this classification.
  classifications:
    multivalued: true
    range: Classification
    inlined_as_list: true
    description: >-
      Classification entries from external schemes, e.g.
      KBOBDocumentTypes2016 / V07100 or DocumentFunctionClassification /
      TEC-PLN on a document, AbstractModelClassification / ARC on a model.
      The `code` slot remains the pragmaticBIM-internal container token; do not
      repeat it here.
  metadata_requirements:
    multivalued: true
    range: DocumentRequirement
    inlined_as_list: true
    description: >-
      Structured list of what the document's own metadata must carry (revision
      index, status code, originator). Documents do not carry a content
      requirement list.

classes:
  Any:
    class_uri: linkml:Any
    description: >-
      Placeholder range for a slot that permits more than one shape; the
      accepted shapes are listed in the slot's any_of.

  LocalizedText:
    slots:
      - de
      - fr
      - it
      - en
    slot_usage:
      de:
        required: true

  LocalizedStringList:
    slots:
      - de
      - fr
      - it
      - en
    slot_usage:
      de:
        required: true
        multivalued: true
      fr:
        multivalued: true
      it:
        multivalued: true
      en:
        multivalued: true

  ContainerPhaseMap:
    class_uri: linkml:Any
    description: >-
      Mapping of container id (Model or Document) to a list of phase ids.

  Classification:
    description: >-
      Generic classification entry from an external scheme (KBOB document
      types, document function, abstract model classification).
      Same slot names as the pragmatic BIM data contract Classification class so
      records round-trip between both schemas. Vocabularies are the SKOS files
      published on schema.pragmaticbim.ch; this schema stores scheme + code only.
    slots:
      - classification_scheme
      - classification_code
      - classification_label
      - classification_uri
      - classification_version
      - classification_source

  DocumentRequirement:
    description: >-
      One metadata item the document file must carry (metadata_requirements).
      The document analog of an Element Attribute: needed_in_phases states when
      the item is required, needed_for_workflows justifies it via the goal →
      workflow → requirement chain. No IFC datatype or ifc_versions, and no
      content-requirement list.
    slots:
      - name
      - sort_order
      - definition
      - allowed_values
      - regex
      - needed_in_phases
      - needed_for_workflows
      - status
      - jurisdiction
    slot_usage:
      name:
        required: true
      needed_in_phases:
        required: true
        minimum_cardinality: 1

  ElementplanDataset:
    tree_root: true
    slots:
      - domains
      - models
      - documents
      - project_goals
      - room_types
      - usage_scenarios
      - workflows
      - valuesets
      - phase_schemes
      - phases
      - phase_mappings
      - phase_subphases
      - custom_pset_entities
      - elements

  Domain:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - file_name
      - status

  Model:
    description: >-
      Model (Teilmodell) within a domain, e.g. Room model or Facade model under
      Architecture. Optional; may be predefined in master templates and inherited
      or extended by projects. Same slots as Domain, plus a required link to the
      parent domain, an optional included_elements pre-tag list, optional
      scheduled_milestones (catalog ids of delivery moments), optional external
      classifications (e.g. AbstractModelClassification). No content
      requirements and no role assignments (audience, reviewer, responsible
      party, or approver).
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - file_name
      - status
      - jurisdiction
      - domain
      - included_elements
      - scheduled_milestones
      - classifications
    slot_usage:
      domain:
        required: true

  Document:
    description: >-
      Document within a domain (non-IFC container, e.g. a 2D plan). Optional;
      may be predefined in master templates and inherited or extended by
      projects. Same slots as Domain, plus a required link to the parent domain,
      an optional included_elements pre-tag list, optional scheduled_milestones
      (catalog ids of delivery moments), and optional description (distinct
      from definition). Optional external classifications
      (KBOBDocumentTypes2016, DocumentFunctionClassification) and
      metadata_requirements whose items link to phases and workflows. No
      content requirements and no role assignments (audience, reviewer,
      responsible party, or approver).
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - description
      - file_name
      - status
      - jurisdiction
      - domain
      - included_elements
      - scheduled_milestones
      - classifications
      - metadata_requirements
    slot_usage:
      domain:
        required: true
      description:
        description: >-
          Short notes on the document, for LLM completeness/fit checks.
          Distinct from definition (catalog purpose). Not a content-requirement
          list.

  AttributePreset:
    description: >-
      One preset value for an attribute of an element, applied when a room
      configuration is used. element + name (+ pset) identify
      the attribute on the element catalog, the same way an Attribute is
      named on IfcSpace (Innenraum). When that attribute has allowed_values,
      value should be one of those entries.
    slots:
      - element
      - name
      - pset
      - value
    slot_usage:
      element:
        required: true
      name:
        required: true
        range: string
        description: >-
          IFC property or attribute name, matching Attribute.name on the
          referenced element (e.g. PredefinedType, LongName, IsExternal).

  RoomType:
    description: >-
      Room or container in a single spatial type graph. A container composes
      room types through contains; extends expresses specialization. External
      room-name and IFC vocabularies remain references rather than classes in
      the programme core.
      configurations are the complete selectable forms of the room. Each
      configuration explicitly contains all fixed element attributes and its
      minimum size; there is no inheritance between the room type and its
      configurations.
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - room_type_kind
      - extends
      - contains
      - legacy_ids
      - status
      - configurations
    slot_usage:
      room_type_kind:
        required: true
      configurations:
        required: true
        minimum_cardinality: 1

  RoomTypeComponent:
    description: >-
      One member of a container room type. Inlined because it has no identity
      outside its parent composition.
    slots:
      - room_type
    slot_usage:
      room_type:
        required: true

  RoomTypeConfiguration:
    description: >-
      One complete selectable configuration of a room type. attribute_presets
      is the full set of fixed element values for this configuration, not an
      override or delta. restrictions contains its minimum dimensions.
      project_goal_levels optionally names the goal levels this configuration
      suits; omit it when the configuration is independent of goal levels.
    slots:
      - id
      - sort_order
      - name
      - description
      - project_goal_levels
      - attribute_presets
      - restrictions
      - status
    slot_usage:
      attribute_presets:
        required: true

  RoomTypeRestriction:
    description: >-
      Minimum size of a room configuration. min_area is the floor area in
      square metres.
      min_height, min_length, and min_width are clear dimensions in metres.
      Every measure is optional.
    slots:
      - min_area
      - min_height
      - min_length
      - min_width

  RoomRelationship:
    description: >-
      One directed edge of an option's room graph. from_room_type and
      to_room_type are the nodes. Optional name labels the edge (e.g. Zugang);
      omit it when the edge is only the link. max_distance is the maximum
      distance in metres between the two room types. Inlined on the option, so it
      has no id of its own. Either end may be a room type that is not also
      listed in adds (e.g. the living room a balcony is reached from).
    slots:
      - from_room_type
      - to_room_type
      - name
      - max_distance
    slot_usage:
      from_room_type:
        required: true
      to_room_type:
        required: true
      name:
        required: false
        description: >-
          Optional label for this edge (e.g. Zugang). Omit when the edge is
          only the link.

  SizeRestriction:
    description: >-
      Minimum size an option size sets on one room type the option
      produces. Every measure is optional; same units as RoomTypeRestriction.
    slots:
      - room_type
      - min_area
      - min_height
      - min_length
      - min_width
    slot_usage:
      room_type:
        required: true

  OptionSize:
    description: >-
      Ordered size of an option (e.g. small, medium, large); sort_order is
      the ordinal. size_restrictions name the room type they apply to,
      because an option can produce several rooms. The size question is
      asked when the chosen option has sizes.
    slots:
      - id
      - sort_order
      - name
      - description
      - size_restrictions

  ScenarioOption:
    description: >-
      One way to meet a scenario's need. adds names the room or container
      types it produces; room_relationships are directed edges between rooms.
      target is the container receiving the added room types (omit for the
      building). exclusive marks an option that excludes
      every other option of its scenario, such as "kein" (no room types and
      no room types), which also makes the scenario optional. excludes
      names options or room types elsewhere that cannot be combined with
      this one; the rule is symmetric and declared on one side.
      project_goal_levels optionally names the goal levels this option suits;
      omit it when the option is independent of goal levels. A chosen level
      can then select among the options.
    slots:
      - id
      - sort_order
      - name
      - description
      - project_goal_levels
      - target
      - sizes
      - adds
      - room_relationships
      - exclusive
      - excludes
    slot_usage:
      project_goal_levels:
        required: false
      target:
        range: RoomType
        inlined: false
        description: >-
          Container room type to which this option adds room types. Omit when
          the added room types belong directly to the building.

  UsageScenario:
    description: >-
      Nutzungsszenario: one need (e.g. Wohnen mit Aussenbezug) and the
      options that meet it. Tags provide lightweight grouping. A scenario with a
      "kein" option (exclusive, producing nothing) is optional; one without
      is mandatory. One option is chosen unless allows_multiple is true;
      with a single option and no "kein", the question is skipped. Choices,
      counts, and the programme tree live in the app. Distinct from Workflow
      Szenarienentwicklung, which is urban design variants.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - tags
      - status
      - jurisdiction
      - allows_multiple
      - options

  ProjectGoal:
    description: >-
      Why information is needed, with ordered levels (Ausprägungen).
      is_boundary_condition marks a goal that sets a boundary condition
      (Rahmenbedingung) instead, such as the Wohnungsmix; its levels then
      activate container room types rather than (or besides) workflows.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - picture_link
      - status
      - comment
      - is_boundary_condition
      - levels

  ProjectGoalLevel:
    description: >-
      Ausprägung (ordered level) of a project goal. sort_order orders the scale
      and is used to copy lower-level workflows onto higher levels. activated_workflows
      is the complete Goal × Level → Workflow set for this level. On a
      boundary-condition goal, activated_room_types is the complete set of
      container room types the level activates; activated_workflows may then
      be empty.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - status
      - activated_workflows
      - activated_room_types
      - comment
    slot_usage:
      activated_room_types:
        inlined: false
        inlined_as_list: false
        description: >-
          Complete set of container room types this level activates (e.g. a
          Wohnungsmix level). Counts per container live in the project.

  Workflow:
    description: >-
      A BIM use case (Anwendungsfall). service_kind marks it as a Grundleistung
      (basic) or a besondere Leistung (special) when that distinction is known.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - workflow_group
      - service_kind
      - parent_workflow
      - picture_link
      - status
      - jurisdiction
      - needed_in_domain
      - comment

  ValueSet:
    slots:
      - id
      - code
      - name
      - description
      - year
      - norm_reference
      - status
      - values
    slot_usage:
      values:
        range: LocalizedStringList
        multivalued: false

  PhaseScheme:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - status

  Phase:
    description: >-
      A pickable phase catalog (e.g. SIA or abstract) with ordered phase codes
      in values. Milestones (B/M/E moments) are part of the phase, not a
      separate catalog. Multiple Phase catalogs may coexist; PhaseMapping
      relates them for display and phase picker translation.
    slots:
      - id
      - name
      - values
      - milestones

  PhaseMapEntry:
    description: >-
      One source→target code pair inside a PhaseMapping (phase code or
      milestone id).
    slots:
      - source
      - target
    slot_usage:
      source:
        required: true
      target:
        required: true

  PhaseMapping:
    description: >-
      Approximate equivalence between two Phase catalogs (e.g. SIA → abstract)
      for display and phase picker. `phases` maps phase codes; `milestones`
      maps milestone ids. Unmapped codes (e.g. Demolish) have no counterpart.
    slots:
      - id
      - source
      - target
      - status
      - name
      - comment
      - phases
      - milestones
    slot_usage:
      source:
        range: Phase
        required: true
        inlined: false
      target:
        range: Phase
        required: true
        inlined: false
      comment:
        range: LocalizedText
      phases:
        range: PhaseMapEntry
        multivalued: true
        inlined_as_list: true
      milestones:
        range: PhaseMapEntry
        multivalued: true
        inlined_as_list: true

  PhaseSubphase:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - status
      - phase

  Milestone:
    description: >-
      A delivery moment that belongs to a Phase (B beginning, M mid, or E end
      of a phase code). Referenced from Model and Document via
      scheduled_milestones ids; not inlined inside model or document YAML.
    slots:
      - id
      - code
      - sort_order
      - name
      - status
      - phase
      - kind
      - date
    slot_usage:
      phase:
        range: string
        required: true
      kind:
        required: true

  CustomPset:
    slots:
      - id
      - code
      - name
      - attributes
    slot_usage:
      attributes:
        required: true
        minimum_cardinality: 1

  Element:
    slots:
      - id
      - code
      - sort_order
      - status
      - name
      - definition
      - needed_in_domain
      - needed_in_models
      - needed_for_models
      - entity_ifc2x3
      - entity_ifc4
      - entity_ifc4_3
      - picture_link
      - picture_print_link
      - attachment_link
      - applicability
      - custom_psets
      - attributes

  Attribute:
    slots:
      - name
      - sort_order
      - pset
      - definition
      - datatype
      - unit
      - allowed_values
      - regex
      - needed_in_phases
      - ifc_versions
      - needed_for_workflows
      - is_applicability
      - status
      - jurisdiction
      - link_uid
    slot_usage:
      name:
        required: true
        range: string
        description: IFC property or attribute name (not a localized catalog title).
      ifc_versions:
        required: true
        minimum_cardinality: 1
      needed_in_phases:
        required: true
        minimum_cardinality: 1
