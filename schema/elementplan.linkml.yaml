id: https://pragmaticbim.ch/id/
name: elementplan
prefixes:
  pragmaticbim: https://pragmaticbim.ch/id/
default_prefix: pragmaticbim
default_range: string

imports:
  - linkml:types

enums:
  StatusEnum:
    permissible_values:
      wip: {}
      active: {}
      deprecated: {}
  IFCVersionEnum:
    permissible_values:
      ifc2x3: {}
      ifc4: {}
      ifc4x3: {}
  IFCDatatypeEnum:
    permissible_values:
      IfcLabel: {}
      IfcText: {}
      IfcIdentifier: {}
      IfcLengthMeasure: {}
      IfcAreaMeasure: {}
      IfcVolumeMeasure: {}
      IfcPositiveLengthMeasure: {}
      IfcCountMeasure: {}
      IfcBoolean: {}
      IfcDate: {}
      IfcReal: {}

slots:
  id:
    identifier: true
    required: true
  de:
    range: string
  fr:
    range: string
  it:
    range: string
  en:
    range: string
  code:
    range: string
  sort_order:
    range: integer
  status:
    range: StatusEnum
  name:
    required: true
    range: LocalizedText
  definition:
    range: LocalizedText
  description:
    range: LocalizedText
  file_name:
    range: LocalizedText
  picture_link:
    range: string
  attachment_link:
    range: string
    description: >-
      Filename of a downloadable attachment under media/attachments/
      (PDF, IFC, or other allowed model formats). Legacy YAML may still
      use model_link; readers should accept both and write attachment_link.
  applicability:
    range: string
  comment:
    range: string
  workflow_group:
    range: string
  parent_workflow:
    range: Workflow
    inlined: false
  year:
    range: integer
  norm_reference:
    range: string
  values:
    multivalued: true
    range: string
  needed_in_domain:
    multivalued: true
    range: Domain
    inlined: false
  needed_in_models:
    multivalued: true
    range: Model
    inlined: false
    description: >-
      Containers (Teilmodelle and documents) this element is assigned to in
      the Information Delivery Plan. Range is Model in LinkML; Document IDs
      are also valid.
  needed_for_models:
    range: ContainerPhaseMap
    inlined: true
    description: >-
      Project-specific IDP override: mapping of container id (Model or
      Document) to a list of phase ids. Missing key → pretags from that
      container's included_elements (all phases that have an information
      requirement). Explicit empty list means the user cleared pretags.
  included_elements:
    multivalued: true
    range: Element
    inlined: false
    description: >-
      Template/default element set for this model or document. The Information
      Delivery Plan pretags these elements until a project-specific
      needed_for_models override exists.
  entity_ifc2x3:
    range: string
  entity_ifc4:
    range: string
  entity_ifc4_3:
    range: string
  attributes:
    multivalued: true
    range: Attribute
    inlined_as_list: true
  custom_psets:
    multivalued: true
    range: CustomPset
    inlined: false
  pset:
    range: string
  datatype:
    range: IFCDatatypeEnum
  unit:
    range: string
    description: Optional unit for measure datatypes (e.g. mm, m², kg).
  allowed_values:
    range: ValueSet
    inlined: false
    description: Optional reference to a ValueSet for enumerated constraints.
  regex:
    range: string
    description: Optional regex pattern for free-text validation when ValueSet is not used.
  ifc_versions:
    multivalued: true
    range: IFCVersionEnum
  needed_for_workflows:
    multivalued: true
    range: Workflow
    inlined: false
  is_applicability:
    range: boolean
  domains:
    multivalued: true
    range: Domain
    inlined_as_list: true
  domain:
    range: Domain
    inlined: false
    description: Parent domain of a model (Teilmodell) or document.
  models:
    multivalued: true
    range: Model
    inlined_as_list: true
    description: >-
      Optional models (Teilmodelle) under a domain. May be predefined in master
      templates and inherited or extended by projects.
  documents:
    multivalued: true
    range: Document
    inlined_as_list: true
    description: >-
      Optional documents under a domain (non-IFC containers, e.g. a 2D plan).
      May be predefined in master templates and inherited or extended by
      projects.
  project_goals:
    multivalued: true
    range: ProjectGoal
    inlined_as_list: true
  levels:
    multivalued: true
    range: ProjectGoalLevel
    inlined_as_list: true
    description: Ordered Ausprägungen of a project goal (ordinal via sort_order).
  activated_workflows:
    multivalued: true
    range: Workflow
    inlined: false
    description: >-
      Complete set of workflows activated when this goal level is selected.
      Higher levels list lower-level workflows explicitly (copied on save).
  workflows:
    multivalued: true
    range: Workflow
    inlined_as_list: true
  valuesets:
    multivalued: true
    range: ValueSet
    inlined_as_list: true
  elements:
    multivalued: true
    range: Element
    inlined_as_list: true
  custom_pset_entities:
    multivalued: true
    range: CustomPset
    inlined_as_list: true
  phase_schemes:
    multivalued: true
    range: PhaseScheme
    inlined_as_list: true
  phases:
    multivalued: true
    range: Phase
    inlined_as_list: true
  phase_subphases:
    multivalued: true
    range: PhaseSubphase
    inlined_as_list: true
  scheme:
    range: PhaseScheme
    inlined: false
  phase:
    range: Phase
    inlined: false
  subphases:
    multivalued: true
    range: PhaseSubphase
    inlined: false
  needed_in_phases:
    multivalued: true
    range: string

classes:
  LocalizedText:
    slots:
      - de
      - fr
      - it
      - en
    slot_usage:
      de:
        required: true

  LocalizedStringList:
    slots:
      - de
      - fr
      - it
      - en
    slot_usage:
      de:
        required: true
        multivalued: true
      fr:
        multivalued: true
      it:
        multivalued: true
      en:
        multivalued: true

  ContainerPhaseMap:
    class_uri: linkml:Any
    description: >-
      Mapping of container id (Model or Document) to a list of phase ids.

  ElementplanDataset:
    tree_root: true
    slots:
      - domains
      - models
      - documents
      - project_goals
      - workflows
      - valuesets
      - phase_schemes
      - phases
      - phase_subphases
      - custom_pset_entities
      - elements

  Domain:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - file_name
      - status

  Model:
    description: >-
      Model (Teilmodell) within a domain, e.g. Room model or Facade model under
      Architecture. Optional; may be predefined in master templates and inherited
      or extended by projects. Same slots as Domain, plus a required link to the
      parent domain and an optional included_elements pre-tag list.
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - file_name
      - status
      - domain
      - included_elements
    slot_usage:
      domain:
        required: true

  Document:
    description: >-
      Document within a domain (non-IFC container, e.g. a 2D plan). Optional;
      may be predefined in master templates and inherited or extended by
      projects. Same slots as Domain, plus a required link to the parent domain
      and an optional included_elements pre-tag list.
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - file_name
      - status
      - domain
      - included_elements
    slot_usage:
      domain:
        required: true

  ProjectGoal:
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - picture_link
      - status
      - comment
      - levels

  ProjectGoalLevel:
    description: >-
      Ausprägung (ordered level) of a project goal. sort_order orders the scale
      and is used to copy lower-level workflows onto higher levels. activated_workflows
      is the complete Goal × Level → Workflow set for this level.
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - status
      - activated_workflows
      - comment

  Workflow:
    slots:
      - id
      - code
      - sort_order
      - name
      - description
      - workflow_group
      - parent_workflow
      - picture_link
      - status
      - needed_in_domain
      - comment

  ValueSet:
    slots:
      - id
      - code
      - name
      - description
      - year
      - norm_reference
      - status
      - values
    slot_usage:
      values:
        range: LocalizedStringList
        multivalued: false

  PhaseScheme:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - status

  Phase:
    slots:
      - id
      - name
      - values

  PhaseSubphase:
    slots:
      - id
      - code
      - sort_order
      - name
      - definition
      - status
      - phase

  CustomPset:
    slots:
      - id
      - code
      - name
      - attributes
    slot_usage:
      attributes:
        required: true
        minimum_cardinality: 1

  Element:
    slots:
      - id
      - code
      - sort_order
      - status
      - name
      - definition
      - needed_in_domain
      - needed_in_models
      - needed_for_models
      - entity_ifc2x3
      - entity_ifc4
      - entity_ifc4_3
      - picture_link
      - attachment_link
      - applicability
      - custom_psets
      - attributes

  Attribute:
    slots:
      - name
      - sort_order
      - pset
      - definition
      - datatype
      - unit
      - allowed_values
      - regex
      - needed_in_phases
      - ifc_versions
      - needed_for_workflows
      - is_applicability
      - status
    slot_usage:
      name:
        required: true
      ifc_versions:
        required: true
        minimum_cardinality: 1
      needed_in_phases:
        required: true
        minimum_cardinality: 1
