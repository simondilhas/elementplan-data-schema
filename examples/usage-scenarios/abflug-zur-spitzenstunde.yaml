id: pragmaticbim:usage-scenario/abflug-zur-spitzenstunde
code: US-01
sort_order: 1
name:
  de: Abflug zur Spitzenstunde
  en: Peak-hour departure
description:
  de: Reisende kommen in der Stosszeit am Flughafen an, geben Gepäck auf, passieren die Sicherheitskontrolle und warten am Gate, bis sie über die Fluggastbrücke ins Flugzeug gehen.
  en: During the peak departure rush, passengers arrive, drop baggage, pass security, wait at the gate, and board via the passenger boarding bridge.
scenario_group: Flughafen
status: active
jurisdiction:
- general
jobs:
- sort_order: 1
  name:
    de: In den Sicherheitsbereich gelangen
    en: Reach the secure area
  description:
    de: Reisende geben das Gepäck auf und passieren die Sicherheitskontrolle.
    en: Passengers drop baggage and pass security screening.
  solutions:
  - sort_order: 1
    name:
      de: Check-in-Halle und Sicherheitskontrolle
      en: Check-in hall and security screening
    required_room_types:
    - pragmaticbim:room-type/check-in-halle
    - pragmaticbim:room-type/sicherheitskontrolle
    room_relationships:
    - from_room_type: pragmaticbim:room-type/check-in-halle
      to_room_type: pragmaticbim:room-type/sicherheitskontrolle
      max_distance: 80
- sort_order: 2
  name:
    de: Einsteigen
    en: Board
  description:
    de: Reisende warten am Gate und gelangen ins Flugzeug.
    en: Passengers wait at the gate and reach the aircraft.
  solutions:
  - sort_order: 1
    name:
      de: Gate mit Fluggastbrücke
      en: Gate with passenger boarding bridge
    required_room_types:
    - pragmaticbim:room-type/gate-warteraum
    - pragmaticbim:room-type/fluggastbruecke
    room_relationships:
    - from_room_type: pragmaticbim:room-type/sicherheitskontrolle
      to_room_type: pragmaticbim:room-type/gate-warteraum
      max_distance: 200
    - from_room_type: pragmaticbim:room-type/gate-warteraum
      to_room_type: pragmaticbim:room-type/fluggastbruecke
      max_distance: 15
  - sort_order: 2
    name:
      de: Ambulift ab Gate
      en: Ambulift from the gate
    required_room_types:
    - pragmaticbim:room-type/gate-warteraum
    - pragmaticbim:room-type/ambulift-standplatz
    room_relationships:
    - from_room_type: pragmaticbim:room-type/gate-warteraum
      to_room_type: pragmaticbim:room-type/ambulift-standplatz
      max_distance: 30
