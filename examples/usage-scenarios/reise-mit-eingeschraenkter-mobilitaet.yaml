name:
  de: Reise mit eingeschränkter Mobilität
  en: Travel with reduced mobility
description:
  de: Reisende mit eingeschränkter Mobilität werden im Betreuungs-Warteraum empfangen, erreichen das Gate barrierefrei mit dem Lift und steigen am Ambulift-Standplatz um.
  en: Passengers with reduced mobility are received in the assistance waiting room, reach the gate step-free by lift, and transfer at the ambulift stand.
scenario_group: Flughafen
