id: armasuisse:workflow/awf-02-k-darstellung-sicherheitsklassifizierungen-der-fassade-nach-comsec-im-modell
sort_order: 19
code: AWF-02-k
name:
  de: Darstellung Sicherheitsklassifizierungen der Fassade nach COMSEC im Modell
  fr: Présentation des classifications de sécurité de la façade selon COMSEC dans le modèle
  it: Rappresentazione classificazioni di sicurezza della facciata secondo la COMSEC nel modello
  en: ''
description:
  de: "**Ziel**\nDie Sicherheitsklassifizierungen der Fassade nach COMSEC werden bauteilbezogen im Modell abgebildet. Interne Verantwortliche können das Konzept direkt im Modell prüfen.\n\n**Nutzen für
    den Auftraggeber**\n- Interne COMSEC-Verantwortliche können die Klassifizierungen direkt im Modell prüfen — ohne aufwändige Planinterpretation\n- Standardisiertes Prüfvorgehen verkürzt Feedbackzyklen\n
    - Abweichungen und Lücken in der COMSEC-Klassifizierung werden räumlich und bauteilbezogen sichtbar\n\n**Umsetzung im Projekt**\nFassadenflächen sowie relevante Bauteile wie Fenster und Türen werden
    mit den entsprechenden COMSEC-Klassifizierungen als Attribute im Modell versehen. Die projektspezifischen Anforderungen werden durch den zuständigen Fachplaner definiert.\n\n**Ergebnis**\n- IFC-Modell
    mit COMSEC-klassifizierten Fassadenbauteilen\n- Grundlage für die standardisierte Prüfung durch interne Verantwortliche"
  fr: Les directives de modélisation doivent être définies par le concepteur de façon spécifique au projet.
  it: Le disposizioni di modellazione devono essere definite dal progettista per il progetto specifico.
  en: ''
