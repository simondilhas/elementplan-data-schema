definition:
  de: Endgerät (Fluid) ist ein technisches Element der Gebäudetechnik (MEP), das als Endpunkt eines Luft-, Wasser- oder sonstigen Medienflusses in einem Raum dient.
  fr: Terminal de fluide est un élément technique du bâtiment (MEP) servant de point terminal d’un flux d’air, d’eau ou d’un autre fluide dans un espace.
  it: Terminale di fluido è un elemento tecnico impiantistico (MEP) che rappresenta il punto finale di un flusso d’aria, acqua o altro fluido all’interno di un ambiente.
