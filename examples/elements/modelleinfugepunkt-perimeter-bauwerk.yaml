id: armasuisse:element/modelleinfugepunkt-perimeter-bauwerk
sort_order: 5
status: active
name:
  de: Modelleinfügepunkt Perimeter & Bauwerk
  fr: Point d'insertion du modèle périmètre et ouvrage
  it: Punto di inserimento del modello perimetro e opera di costruzione
  en: ''
needed_in_domain:
- armasuisse:domain/referenz-perimeter
- armasuisse:domain/referenz-bauwerk
definition:
  de: "Die Modelleinfügepunkte Perimeter werden vom Bauherrn definiert und bei Projektstart gemäss folgendem Konzept übergeben:\n\nDie Georeferenzierung der Modelle erfolgt nach dem Prinzip einer Kaskade\
    \ der Koordinaten gemäss dem dargestellten Beispiel unten. Der Hauptkoordinierungspunkt (rot durch ein physisches Objekt vor Ort) wird von einem Vermesser definiert. \n\nDieser Standorttpunkt ist die\
    \ Referenz, die allen anderen Modellen (grün mit der Rotation des Gebäudes), unabhängig von ihren Disziplinen, gemeinsam ist."
  fr: "Les points d'insertion des modèles Périmètre sont définis par le maître d'ouvrage et transmis au démarrage du projet selon le concept suivant :  \n\nLe géoréférencement des modèles repose sur le\
    \ principe d'une cascade de coordonnées selon l'exemple présenté ci-dessous. Le point de coordination principal (représenté en rouge par un objet physique sur place) est défini par un géomètre.  \n\n\
    Ce point de localisation est la référence commune à tous les autres modèles (en vert avec la rotation du bâtiment), indépendamment de leurs disciplines."
  it: "I punti di inserimento del modello perimetro vengono definiti dal committente e consegnati all’avvio del progetto secondo il seguente concetto:  \n\nLa georeferenziazione dei modelli viene effettuata\
    \ secondo il principio della cascata di coordinate, come mostrato nell’esempio seguente. \nIl punto di coordinamento principale (contrassegnato in rosso da un oggetto fisico in loco) viene definito\
    \ da un topografo.\n   \nQuesto punto di localizzazione è il riferimento comune a tutti gli altri modelli (in verde con la rotazione dell’edificio), indipendentemente dalle relative discipline."
  en: ''
