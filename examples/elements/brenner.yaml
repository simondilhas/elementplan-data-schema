    de: Jedes gebäudetechnische Bauteil muss einem technischen System zugeordnet werden. Die Zuordnung stellt sicher, dass Funktionen, Abhängigkeiten und Verantwortlichkeiten eindeutig definiert sind und
      ermöglicht eine konsistente Auswertung über Planung, Ausführung und Betrieb hinweg.
