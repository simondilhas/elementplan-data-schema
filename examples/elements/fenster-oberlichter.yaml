      - SKYLIGHT: Dachfenster

      - LIGHTDOME: Lichtkuppel

      z. B. "LIGHTDOME"

      USERDEFINED ... alle anderen'
    fr: "Définit le type de fenêtre. \n \n- WINDOW : fenêtre dans le mur \n- SKYLIGHT : fenêtre de toit \n- LIGHTDOME : fenêtre coupole \np. ex. \"LIGHTDOME\" \nUSERDEFINED ... tous les autres"
    it: "Definisce di quale tipo di finestra si tratta.\n  \n- WINDOW: Finestra nella parete \n- SKYLIGHT: Lucernario \n- LIGHTDOME: Lucernario a cupola\nad es. \"LIGHTDOME\" \nUSERDEFINED ... tutti gli\
