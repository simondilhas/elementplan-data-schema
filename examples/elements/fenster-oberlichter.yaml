definition:
  de: "Es sind alle Innen- und Aussenfenster zu modellieren.\n\n**Modellierungshinweise:**\n- Der Glasanteil muss mit einem transparenten Material exportiert werden. \n- Jedes Fenster hat einen Bezug zum\
    \ Raum."
  fr: "Toutes les fenêtres intérieures et extérieures doivent être modélisées.\n\n**Note pour la modélisation.**\n- Le vitrage doit être exporté avec un matériau transparent. \n- Chaque fenêtre a une relation\
    \ avec le local."
  it: "Modellare tutte le finestre interne ed esterne.  \n\n**Indicazioni per la modellazione.** \n- La parte di vetro deve essere esportata con un materiale trasparente.  \n- Ogni finestra ha una connessione\
    \ con la stanza."
  en: ''
