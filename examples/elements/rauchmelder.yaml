name:
  de: Rauchmelder
  fr: Détecteur de fumée
  it: Rilevatore di fumo
  en: ''
needed_in_domain:
- armasuisse:domain/nachweismodell-elektro
- armasuisse:domain/gebaudetechnik
definition:
  de: Ein Brandmelder ist ein Gerät, das das Vorhandensein von Rauch, Hitze oder Flammen erkennen soll, um einen potenziellen Brand schnell zu melden. Er warnt die Bewohner eines Gebäudes, indem er einen
    Alarm auslöst, so dass sie sicher evakuiert werden können und die Rettungskräfte schnell eingreifen können.
  fr: Un détecteur d'incendie est un appareil conçu pour détecter la présence de fumée, de chaleur ou de flammes afin de signalser rapidement un incendie potentiel. Il permet de prévenir les occupants d’un
    bâtiment en émettant une alarme afin qu'ils puissent évacuer en toute sécurité et que les secours puissent intervenir rapidement.
  it: Un rilevatore di incendio è un dispositivo progettato per rilevare la presenza di fumo, calore o fiamme al fine di segnalare rapidamente un potenziale incendio. Avvisa gli occupanti di un edificio
    attivando un allarme, in modo che possano essere evacuati in sicurezza e i soccorsi possano intervenire rapidamente.
  en: ''
