definition:
  de: Eine Brandschutzklappe ist eine Sicherheitseinrichtung, die in Lüftungskanälen installiert wird. Sie schließt sich im Brandfall automatisch, um die Brandausbreitung zu blockieren.
  fr: Un clapet coupe-feu est un dispositif de sécurité installé dans les conduits de ventilation. Il se ferme automatiquement en cas d'incendie pour bloquer la propagation du feu.
  it: Una serranda tagliafuoco è un dispositivo di sicurezza installato nei condotti di ventilazione. Si chiude automaticamente in caso di incendio per bloccare la propagazione del fuoco.
  en: ''
