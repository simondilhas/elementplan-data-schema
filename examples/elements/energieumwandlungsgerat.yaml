  fr: Appareil de conversion d’énergie est un élément technique du bâtiment (MEP) destiné à transformer une forme d’énergie (thermique, électrique ou mécanique) au sein d’un système technique.
  it: Dispositivo di conversione dell’energia è un elemento tecnico impiantistico (MEP) destinato alla trasformazione di una forma di energia (termica, elettrica o meccanica) all’interno di un sistema impiantistico.
