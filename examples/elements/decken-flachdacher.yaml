- name: FireRating
  pset: Pset_SlabCommon
  definition:
    de: Klassifizierung des Feuerwiderstands eines Bauteils. Gibt an, wie lange ein Element im Brandfall seine Funktion (Tragfaehigkeit, Raumabschluss, Waermedaemmung) aufrechterhaelt. Ueblicherweise in
      Minuten angegeben (z. B. EI30, REI60).
    fr: Classification de la resistance au feu d’un element. Indique la duree pendant laquelle il conserve ses performances (stabilite, etancheite, isolation) en cas d’incendie. Generalement exprimee en
      minutes (p. ex. EI30, REI60).
    it: Classificazione della resistenza al fuoco di un elemento. Indica per quanto tempo mantiene le proprie prestazioni (portanza, tenuta, isolamento) in caso di incendio. Generalmente espressa in minuti
      (es. EI30, REI60).
    en: ''
