definition:
  de: Eine Hebepumpe ist ein Gerät, das es ermöglicht, Abwasser oder Regenwasser von einem niedrigen Niveau zu einem höher gelegenen Abfluss zu pumpen.
  fr: Une pompe de relevage est un équipement qui permet de remonter les eaux usées ou pluviales d'un niveau bas vers une évacuation située plus haut.
  it: Una pompa di sollevamento è un'apparecchiatura che permette di sollevare le acque reflue o piovane da un livello basso verso uno scarico situato più in alto.
  en: ''
