- name: BuildingID
  pset: Pset_BuildingCommon
  definition:
    de: "Ein eindeutiger Identifikator, der einem Gebäude zugewiesen wird. Eine vorläufige Kennung wird zunächst bei der Einreichung eines Bauantrags zugewiesen. Diese vorläufige Kennung wird in eine dauerhafte\
      \ Kennung umgewandelt, wenn das Gebäude in einer gesetzlich vorgeschriebenen Gebäude- und Grundstücksdatenbank registriert wird. \n\nBei armasuisse Immobilien ist dies die 2-stellige Objekt Nr., zB.\
      \ \"GA\""
    fr: "Un identificateur unique, qui est attribué à un bâtiment. Une identification provisoire qui est d’abord attribuée lorsque la demande d’autorisation de construire est déposée. Cette identification\
      \ provisoire devient permanente quand le bâtiment est enregistré dans une base de données légale des bâtiments et des terrains.  \n\nChez armasuisse Immobilier, il s’agit d’un n° d’objet à deux caractères,\
      \ p. ex. : \"GA\""
    it: "Identificatore univoco assegnato a un edificio. Al momento della presentazione della domanda di costruzione viene assegnato inizialmente un codice provvisorio. \nQuest’ultimo viene trasformato\
      \ in un codice permanente una volta che l’edificio viene registrato in una banca dati di edifici e terreni prescritta per legge. \n\nPer armasuisse Immobili il n. immobile è il numero dell'immobile\
      \ a 2 cifre: \"GA\""
    en: ''
  datatype: IfcIdentifier
  allowed_values: null
