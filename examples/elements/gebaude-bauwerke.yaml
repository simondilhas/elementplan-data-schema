definition:
  de: 'Gebäude sind mit dem Boden fest verbundene Bauten. Bei Doppel-, Gruppen- und Reihenhäusern zählt jedes Gebäude in der Regel als selbstständig, wenn es einen eigenen Zugang von aussen hat und wenn
    zwischen den Gebäuden eine senkrechte, vom Erdgeschoss bis zum Dach reichende, tragende Trennmauer besteht.​ In Abstimmung mit dem Projektleiter Bauherr darf von dieser Definition abgewichen werden.


    **Modellierungshinweis:**

    Die Aufteilung in Gebäude ist mit dem Projektleiter im Vorfeld abzuklären. Kriterien können sein:

    - Kostengliederung / Teilobjekte

    - Reduktion der Dateigrösse für besser Performance

    - Etappierungen

    - ...'
  fr: "Les bâtiments sont des constructions solidement fixées au sol. Dans le cas de maisons jumelées, groupées ou mitoyennes, chaque bâtiment est généralement considéré comme indépendant s'il dispose de\
    \ son propre accès depuis l'extérieur et s'il existe entre les bâtiments un mur de séparation vertical porteur allant du rez-de-chaussée au toit. En accord avec le chef de projet du maître d'ouvrage,\
    \ il est possible de s'écarter de cette définition. \n\n**Note pour la modélisation.**\nLa répartition en bâtiments doit être clarifiée au préalable avec le chef de projet. Les critères peuvent être :\
    \ \n- Répartition des coûts / sous-objets \n- Réduction de la taille du fichier pour de meilleures performances \n- Étapes \n- ..."
  it: "Gli edifici sono strutture saldamente ancorate al suolo. \nNel caso di case abbinate, a gruppi e a schiera, ogni edificio è generalmente considerato indipendente se ha un proprio accesso dall'esterno\
    \ e se esiste un muro divisorio verticale portante tra gli edifici che si estende dal piano terra al tetto. \nQuesta definizione può essere derogata in consultazione con il capoprogetto del committente.\
    \  \n  \n**Indicazione per la modellazione:** \nLa suddivisione in edifici dovrà essere chiarita preventivamente con il capoprogetto. \nI criteri possono essere: \n- Ripartizione costi/sottooggetti\
    \ \n- Riduzione delle dimensioni del file per prestazioni migliori \n- Fasi \n- ..."
  en: ''
