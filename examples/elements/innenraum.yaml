id: armasuisse:element/innenraum
sort_order: 8
status: active
name:
  de: Innenraum
  fr: Espace intérieur
  it: Spazio interno
  en: ''
needed_in_domain:
- armasuisse:domain/architektur
- armasuisse:domain/nachweismodell-architektur
definition:
  de: 'Innenräume repräsentieren die Nutzflächen gemäss SIA 416 (Bruttoräume sind separat beschrieben) und sind geschossweise modelliert. Innenräume werden für jeden Raum entsprechend den raumbildenden
    Elementen angelegt.


    Gemäss SIA, d0165 sind lichte Querschnitte von Schächten, Kaminen und Installationskanälen unter 0.25 m2 der Konstruktionsfläche zuzuweisen. Treppenaugen unter 0.25 m2 sind dem Treppenraum zuzuweisen.


    **Modellierungshinweis:**

    - Sämtliche Flächen/Volumen sind mit dem Raumwerkzeug der CAD-Software als Volumen zu modellieren.

    - Es muss jeder Hohlraum modelliert werden. Zum Beispiel  Technik-,  Aufzugsschächte und Lufträume.

    - Damit die Flächenauszüge korrekt sind, darf es zu keinen Raumüberschneidungen und Raumdoppelungen kommen.

    - Die Räume sollten beim Architekturmodell von der Oberkante des fertigen Bodens bis zur Unterkante der fertigen Decke und beim TGA-Modell von der Mitte der unteren bis zur Mitte der oberen Decke modelliert
    werden, damit die technischen Komponenten des Gebäudes den Räumen eindeutig zugeordnet werden können.'
  fr: "Les espaces intérieurs représentent les surfaces utiles selon SIA 416 (les surfaces bruts sont décrits séparément) et sont modélisés par étage. Les surfaces nettes sont créées pour chaque local selon\
    \ les éléments constitutifs du local. \n\nSelon SIA, d0165, les sections intérieures des gaines, cheminées et canaux d'installation inférieures à 0,25 m2 doivent être attribuées à la surface de construction.\
    \ Les jours (vides) d'escalier de moins de 0,25 m2 doivent être attribués à la cage d'escalier.  \n\n**Note pour la modélisation.** \n- Toutes les surfaces/volumes doivent être modélisés sous forme\
    \ de volumes à l'aide de l'outil spatial du logiciel CAO. \n- Chaque espace doit être modélisé. Par exemple, les gaines techniques, les cages d’ascenseur et les espaces vides. \n- Pour que les extractions\
    \ de surfaces soient correctes, il ne doit y avoir aucun chevauchement ou duplication de locaux. \n- Les locaux doivent être modélisés à partir du bord supérieur du sol fini jusqu'au bord inférieur\
    \ du plafond fini pour la maquette architecturale et du milieu du plafond inférieur jusqu'au milieu du plafond supérieur pour les maquettes GTA, afin que les composants techniques du bâtiment puissent\
    \ être clairement attribués aux locaux."
  it: "Gli spazi chiusi rappresentano le superfici utili secondo la SIA 416 (i locali lordi sono descritti separatamente) e sono modellati per piano. \nGli spazi chiusi vengono creati per ciascun locale\
    \ in base agli elementi costitutivi dello stesso.  \n\nSecondo la norma SIA, d0165, le sezioni trasversali libere di pozzetti, camini e condotti di installazione inferiori a 0,25 m2 devono essere assegnate\
    \ alla superficie di costruzione. Le aperture dei vani scala inferiori a 0,25 m2 devono essere assegnate all’area del vano scala.  \n\n**Indicazione per la modellazione.**\n- Tutte le superfici/tutti\
    \ i volumi devono essere modellati come volumi utilizzando lo strumento spaziale del software CAD. \n- Ogni cavità deve essere modellata, ad esempio impianti tecnici, pozzi degli ascensori e spazi a\
    \ tutta altezza.  \n- Affinché le sezioni delle superfici siano corrette non devono esserci sovrapposizioni o duplicazioni di locali. \n- Nel plastico architettonico, i locali devono essere modellati\
    \ dal bordo superiore del pavimento finito fino al bordo inferiore del soffitto finito e nel modello TGA dal centro del soffitto inferiore al centro del soffitto superiore, in modo che i componenti\
    \ tecnici dell’edificio possano essere chiaramente assegnati ai locali."
  en: ''
