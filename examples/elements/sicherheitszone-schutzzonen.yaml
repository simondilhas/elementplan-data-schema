name:
  de: Sicherheitszone / Schutzzonen
  fr: Zone de sécurité / zones de protection
  it: Zona di sicurezza / zone di protezione
  en: ''
needed_in_domain:
- armasuisse:domain/architektur
definition:
  de: "Die Schutzzonen werden als IfcZone modelliert. \n\n**Modellierungshinweis:**\n* IfcSpaces mit identischen Funktionen werden zu einer IfcZone gruppiert. Die Zonennamen müssen der Klassifikation entsprechen,\
    \ z.B. mit \"Schutzzone 1\". Die Gruppierung nach mehrstufiger Hierarchie ist auch für IfcZone-Zuordnungen möglich. \n* Beispiel: Sie können einige Räume (IfcSpaces) in einer IfcZone (Schutzzone 1)\
    \ gruppieren, die zu einer IfcZone-Gruppe einer höheren Ebene gehört (z.B. Verwaltungs-Raumfläche)."
  fr: "Les zones de protection sont modélisées comme IfcZone.   \n\n**Note pour la modélisation.**\n* les IfcSpace avec des fonctions identiques sont regroupés dans une IfcZone, par exemple avec le nom\
    \ \"Security Zone\". Le regroupement par hiérarchie multi-niveaux est également possible pour les affectations IfcZone.  \n* Par exemple: vous pouvez regrouper certaines zones de locaux (IfcSpace) dans\
    \ une IfcZone (zone de protection 1) qui appartient à un groupe IfcZone de niveau supérieur (par exemple, zone de surfaces administratives)."
  it: "Le zone di protezione sono modellate come IfcZone.   \n\n**Indicazione per la modellazione.**\n* IfcSpaces con funzioni identiche sono raggruppati in una IfcZone. \nI nomi delle zone devono corrispondere\
    \ alle classificazioni, ad es. \"zona di protezione 1\".  \nPer le assegnazioni IfcZone è possibile anche il raggruppamento per gerarchia multilivello.  \n* Esempio: è così possibile raggruppare alcuni\
    \ locali (IfcSpaces) in una IfcZone (zona di protezione 1) che appartiene ad un gruppo IfcZone di livello superiore (ad es. superficie amministrazione)."
  en: ''
