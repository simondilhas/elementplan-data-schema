definition:
  de: Ein Gebläsekonvektor ist ein Gerät, das mit einem Ventilator und einem Wärmetauscher ausgestattet ist, um die Temperatur in einem Raum zu regulieren. Er verteilt heiße oder kalte Luft.
  fr: Un ventilo-convecteur est un appareil équipé d'un ventilateur et d'un échangeur de chaleur permettant de réguler la température dans un espace. Il distribue de l'air chaud ou froid.
  it: Un ventilconvettore è un dispositivo dotato di un ventilatore e di uno scambiatore di calore per regolare la temperatura in un spazio, distribuendo aria calda o fredda.
  en: ''
