name:
  de: Geschossvolumen
  fr: Volume de l’étage
  it: Volume del piano
  en: ''
needed_in_domain:
- armasuisse:domain/architektur
definition:
  de: "Das Geschossvolumen dient zur Berechnung des Gebäudevolumens gemäss SIA 416 sowie städtebaulichen Visualisierungen.\n\n**Modellierungshinweise:**\n* Es ist ein Volumen als IfcSpace geschossweise\
    \ zu modellieren. \n- Im UG von UK Fundament bis zu UK Rohdecke\n- In den Geschossen UK Rohdecke bis zu UK Rohdecke\n- Im obersten Geschoss UK Rohdecke bis OK Dachhaut\n* Das Geschossvolumen ist mit\
    \ IfcSpace PredefindedType: GFA zu modellieren."
  fr: "Le volume de l’étage permet de calculer les surfaces de plancher de l'étage (SP), le volume de l’étage (VE) et les visualisations de l’urbanisme.   \n\n**Note pour la modélisation.**\n* Un volume\
    \ doit être modélisé pour chaque étage comme un IfcSpace. \n- Au sous-sol, au-dessous des fondations jusque au-dessous de la dalle brute supérieure \n- Aux étages depuis le dessous de la dalle brute\
    \ jusque au-dessous de la dalle brute du niveau supérieur \n- Au dernier étage, depuis le dessous de la dalle brute jusque au-dessus de la couverture du toit  Les structures de grenier, les auvents\
    \ et les panneaux en porte-à-faux sont sur-mesurés.  \n* L'espace brut est à modéliser avec IfcSpace PredefinedType : GFA.  Le bord extérieur du volume de plancher se trouve sur le bord extérieur de\
    \ la façade."
  it: "Il volume dei piani serve a calcolare il volume dell’edificio secondo la SIA416 nonché le visualizzazioni urbanistiche. \n\n**Indicazioni per la modellazione.**\n* Un volume deve essere modellato\
    \ piano per piano come IfcSpace.\n- Nel seminterrato dal bordo inferiore della sottostruttura fino al bordo inferiore del soffitto grezzo    \n- Ai piani dal bordo inferiore del soffitto grezzo fino\
    \ al bordo inferiore del soffitto grezzo    \n- All’ultimo piano, dal bordo inferiore del soffitto grezzo al bordo superiore della copertura del tetto  \n* Il volume dei piani deve essere modellato\
    \ con IfcSpace PredefindedType: GFA."
  en: ''
