id: armasuisse:element/luftraum
sort_order: 9
status: active
name:
  de: Luftraum
  fr: Vide d'étage
  it: Vuoto del piano
  en: ''
needed_in_domain:
- armasuisse:domain/architektur
- armasuisse:domain/nachweismodell-architektur
definition:
  de: 'Um keine Hohlräume im Gebäude zu haben und verschiedene Flächenberechnungen (SIA 416) automatisiert ausführen zu können, ist der Luftraum in mehrgeschossigen Räumen als eigener Raum geschossweise
    zu modellieren.


    **Hinweis:** Installationsschächte und Liftschächte sind keine Lufträume sondern müssen gemäss SIA416 pro Geschoss modelliert werden.


    **Modellierungshinweis:**

    Lufträume sind als eigener Raum von Oberkante des unteren Raumes bis Unterkante Rohdecke (UKRD) und geschossweise zu modellieren.'
  fr: "Afin de ne pas avoir d'espaces vides dans le bâtiment et de pouvoir exécuter de façon automatique les différents calculs de surfaces (SIA 416), le vide d'étage doit être modélisé en tant qu’espace\
    \ spécifique étage par étage.\n\n**Remarque:** Les gaines techniques et les cages d'ascenseur ne sont pas des espaces aériens mais doivent être modélisés par étage selon SIA416.   \n\n**Note pour la\
    \ modélisation:**\nLes vides d'étage doivent être modélisés comme des espaces séparés depuis le bord supérieur de la pièce jusqu'au bord inférieur du plafond nu, et étage par étage."
  it: "Per non avere vuoti nell’edificio e poter svolgere i calcoli delle diverse superfici (SIA 416) in maniera automatizzata, lo spazio a tutta altezza nei locali che si estendono su più piani deve essere\
    \ modellato come spazio a sé per piano.  \n\n**Nota.** I pozzi delle installazioni e degli ascensori non sono spazi a tutta altezza ma devono essere modellati per ciascun piano secondo la SIA416.  \n\
    \n**Indicazione per la modellazione.**\nGli spazi a tutta altezza devono essere modellati come uno spazio a sé dal bordo superiore del locale inferiore al bordo inferiore del soffitto grezzo, e piano\
    \ per piano."
  en: ''
