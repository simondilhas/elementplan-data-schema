definition:
  de: 'Jede nutzbare Ebene ist ein eigenes Geschoss. Damit können:

    - Die Modelle im BIM-Viewer besser navigiert werden.

    - Auswertungen geschossweise gemacht werden.


    **Modellierungshinweise:**

    - Die Decke über einem Geschoss wird in das darüberliegende Geschoss gelegt.

    - Wenn es notwendig ist die abgehängte Decke zu modellieren, so wird diese in das Geschoss gelegt in dem der Raum ist.

    - Jeder modellierte Bauteil ist einem Geschoss zugeordnet.

    - Geschossübergreifende Bauteile (wie z.B. Wände) werden geschossweise getrennt.'
  fr: 'Chaque niveau utilisable est un étage à part entière. Ainsi, il est possible de :

    - Mieux naviguer dans le BIM-Viewer avec les modèles.

    - Faire des relevés/analyses par étage.


    **Note pour la modélisation.**

    - La dalle située au-dessus d''un étage est placée sur le niveau supérieur.

    - S''il est nécessaire de modéliser un faux-plafond, celui-ci est affecté sur le niveau dans lequel se trouve la pièce.

    - Chaque composant modélisé est affecté à un étage.

    - Les composants répartis sur les étages, par exemple les murs, sont divisés étage par étage.'
  it: "Ogni livello utile è un piano a sé stante. In questo modo è possibile: \n- Navigare meglio tra i modelli nel visualizzatore BIM; \n- Effettuare valutazioni per i piani.  \n\n**Indicazioni per la\
    \ modellazione.**\n- Il soffitto sopra un piano è posto al piano superiore. \n- Se è necessario modellare il controsoffitto, questo viene collocato nel piano in cui si trova la stanza. \n- Ciascun componente\
    \ modellato è assegnato a un piano. \n- I componenti trasversali ai piani (ad es. le pareti) sono separati piano per piano."
  en: ''
