id: armasuisse:element/i-002-notlichtanlage
sort_order: 26
status: active
name:
  de: I-002 Notlichtanlage
  fr: I-002 Installation d’éclairage de secours
  it: I-002 Impianto di illuminazione di emergenza
  en: ''
needed_in_domain:
- armasuisse:domain/gebaudetechnik
definition:
  de: 'Die Notlichtanlage ist ein Sicherheitssystem, das die Beleuchtung bereitstellt, wenn die normale Stromversorgung ausfällt. Sie wird insbesondere in öffentlichen Gebäuden, Unternehmen und grösseren
    Einrichtungen verwendet, um sicherzustellen, dass Menschen auch bei einem Stromausfall sicher evakuieren können.


    Alle Elemente der Notlichtanlage die einer Notlichtanlage zugeordnet sind, werden in einem System zusammengefasst.'
  fr: 'Note pour la modélisation: L''éclairage est un élément important pour l''utilisation d''un bâtiment et un élément essentiel du concept architectural d''un bâtiment. De plus, l’éclairage constitue
    un lien entre l’architecture et l’électrotechnique. La planification de l''éclairage nécessite des calculs spécifiques et repose sur ses propres unités, dimensions, règles et normes. Un système est
    géré comme un IfcSystem. Tous les éléments d''une installation d''éclairage de secours sont affectés au même système'
  it: "L’impianto di illuminazione di emergenza è un sistema di sicurezza che fornisce illuminazione in caso di interruzione della normale alimentazione elettrica. \nViene utilizzato in particolare negli\
    \ edifici pubblici, nelle aziende e nelle strutture più grandi per garantire che le persone possano intraprendere un’evacuazione in sicurezza anche in caso di interruzione dell’alimentazione.  \n\n\
    Tutti gli elementi dell’impianto di illuminazione di emergenza che sono attribuiti a un impianto di illuminazione di emergenza vengono riuniti in un unico sistema."
  en: ''
