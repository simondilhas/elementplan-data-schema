definition:
  de: Ein Abwasserschacht ist ein unterirdisches, mit einem Deckel verschlossenes Bauwerk, das Zugang zu den Abwasserleitungen bietet. Er ermöglicht die Inspektion und Wartung des Abwassernetzes.
  fr: Un regard d'eaux usées est un ouvrage enterré, fermé par un couvercle, qui donne accès aux canalisations. Il permet d'inspecter et d'entretenir le réseau d'assainissement.
  it: Un pozzetto per acque reflue è un'opera interrata, chiusa da un coperchio, che dà accesso alle tubazioni. Permette di ispezionare e mantenere la rete fognaria.
  en: ''
