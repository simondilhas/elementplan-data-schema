definition:
  de: Da das baurechtliche Grundstück nicht zwangsläufig deckungsgleich mit dem Planungsperimeter ist, können mehrere Parzellen gemäss Katasterplan zu einer IfcSite zusammengefasst werden.
  fr: Comme le terrain relevant du droit de la construction ne coïncide pas nécessairement avec le périmètre de planification, plusieurs parcelles peuvent être regroupées en un seul IfcSite conformément
    au plan cadastral.
  it: Poiché il terreno secondo il diritto di superficie non coincide necessariamente con il perimetro di pianificazione, è possibile riunire in un IfcSite diverse particelle secondo il piano di catasto.
  en: ''
