name:
  de: I-007 Aufzüge
  fr: I-007 Ascenseurs
  it: I-007 Ascensori
  en: ''
needed_in_domain:
- armasuisse:domain/gebaudetechnik
definition:
  de: 'Der Aufzug wird als System modelliert.


    **Modellierungshinweis:**

    Der Liftschacht ist gemäss SIA416 als eigner Raum zu modellieren. Der Aufzugstechnikraum, die Schachträume und alle Aufzugstüren sind im System Aufzugsanlage zusammenzufassen.'
  fr: "Les ascenseurs sont modélisés comme un système.  \n\n**Note pour la modélisation.**\nLa cage d'ascenseur doit être modélisée comme une pièce séparée conformément à SIA416. Le local technique de l'ascenseur,\
    \ les locaux de la cage et toutes les portes d'ascenseur doivent être combinés dans le système d'ascenseur."
  it: "L’ascensore viene modellato come sistema.  \n\n**Indicazione per la modellazione.**\nIl pozzo dell’ascensore viene modellato come spazio proprio secondo la SIA416. \nNel sistema dell’impianto dell’ascensore\
    \ devono essere riuniti il ​​locale tecnico dell’ascensore, il pozzo e tutte le porte dell’ascensore."
  en: ''
