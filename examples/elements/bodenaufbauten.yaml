definition:
  de: Bodenbeläge werden erst als eigenes Element modelliert, wenn es unterschiedliche Bodenbeläge oder Aufbauten innerhalb eines Raumes gibt. Sonst werden die Informationen im Element "Raum" gepflegt.
  fr: Les revêtements de sol ne sont modélisés en tant qu’élément spécifique que si l’on trouve différents revêtements de sol ou structures à l’intérieur d’une pièce. Sinon, les informations sont gérées
    dans l'élément "Espace".
  it: I rivestimenti dei pavimenti vengono modellati come elemento a parte solo se all’interno di un locale vi sono diversi rivestimenti o allestimenti. Altrimenti, le informazioni vengono gestite nell'elemento
    "Spazio".
