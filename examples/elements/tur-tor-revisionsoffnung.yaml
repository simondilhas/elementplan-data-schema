- name: RelationToSpace
  pset: Cust_Element
  definition:
    de: Für jede Tür muss die dazugehörige Raumnummer (siehe Attribut "Innenraum, Eindeutige Raumnummer") im Attribut gepflegt werden. Es ist der Raum zu wählen, in den die Tür öffnet. Man beginnt bei der
      Eingangstüre. z.B. "0108" (Siehe Kennzeichnungskonzep)
    fr: Pour chaque porte, il faut mettre à jour le numéro de local correspondant (voir attribut "Espace intérieur, numéro de local unique") dans l’attribut. Il faut choisir le local que la porte permet
      d’ouvrir. On commence par la porte d’entrée, p. ex. "0108" (voir concept de marquage).
    it: Per ogni elemento di porte e finestre è necessario registrare nell’attributo il numero di locale corrispondente (vedere l'attributo "Interno, numero unico della camera"). Per le porte va scelto
      il locale verso il quale la porta si apre. Si inizia dalle porte d'ingresso. Ad es. "0108" (vedere il sistema di etichettatura)
    en: ''
