- name: IsExternal
  pset: Pset_DoorCommon
  definition:
    de: 'Gibt an ob es sich um eine Tür zwischen zwei Innenräumen oder zwischen Innen und Aussen handelt.

      - True wenn die Türe nach aussen führt

      - False wenn die Türe zwischen zwei Innenräumen ist'
    fr: "Indique s’il s’agit d’une porte entre deux espaces intérieurs ou entre l’intérieur et l’extérieur. \n- True si la porte mène à l’extérieur \n- False si la porte se trouve entre deux espaces intérieurs"
    it: "Indica se si tratta di una porta tra due ambienti interni o tra interno ed esterno. \n- True se la porta conduce all'esterno \n- False se la porta è tra due ambienti interni"
    en: ''
