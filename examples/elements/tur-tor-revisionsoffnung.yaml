- name: OperationType
  pset: null
  definition:
    de: 'Der OperationType ist eine standardisierte Typisierung um die Öffnungsart zu definieren. z.B. "SINGLE_SWING_LEFT"


      - SINGLE_SWING_LEFT ... Einflügelig Schwingen Links

      - SINGLE_SWING_RIGHT ... Einflügelig Schwingen Rechts

      - DOUBLE_DOOR_SINGLE_SWING ... Doppeltür Einflügelig Schwingen

      - DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT ... Doppeltür Einflügelig Schwingen Gegenüber Links

      - DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT ... Doppeltür Einflügelig Schwingen Gegenüber Rechts

      - DOUBLE_SWING_LEFT ... Doppelt Schwingen Links

      - DOUBLE_SWING_RIGHT ... Doppelt Schwingen Rechts

      - DOUBLE_DOOR_DOUBLE_SWING ... Doppeltür Doppelt Schwingen

      - SLIDING_TO_LEFT ... Schieben Nach Links

      - SLIDING_TO_RIGHT ... Schieben Nach Rechts

      - DOUBLE_DOOR_SLIDING ... Doppeltür Schieben

      - FOLDING_TO_LEFT ... Falten Nach Links

      - FOLDING_TO_RIGHT ... Falten Nach Rechts

      - DOUBLE_DOOR_FOLDING ... Doppeltür Falten

      - REVOLVING ... Drehtür

      - ROLLINGUP ... Aufrollen

      - SWING_FIXED_LEFT ... Schwingen Fest Links

      - SWING_FIXED_RIGHT ... Schwingen Fest Rechts

      - USERDEFINED ... Benutzerdefiniert'
    fr: "Le OperationType est une catégorisation standardisée permettant de définir le type d’ouverture, p. ex. \"SINGLE_SWING_LEFT\"  \n\n- SINGLE_SWING_LEFT ... un vantail pivotant gauche \n- SINGLE_SWING_RIGHT\
      \ ... un vantail pivotant droite \n- DOUBLE_DOOR_SINGLE_SWING ... double porte un vantail pivotant\n- DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT ... double porte un vantail pivotant côté opposé, gauche\
      \ \n- DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT ... double porte un vantail pivotant côté opposé, droite \n- DOUBLE_SWING_LEFT ... double pivotant gauche \n- DOUBLE_SWING_RIGHT ... double pivotant droite\
      \ \n- DOUBLE_DOOR_DOUBLE_SWING ... double porte, double pivotant \n- SLIDING_TO_LEFT ... coulissant vers la gauche \n- SLIDING_TO_RIGHT ... coulissant vers la droite \n- DOUBLE_DOOR_SLIDING ... double\
      \ porte coulissante \n- FOLDING_TO_LEFT ... pliant vers la gauche \n- FOLDING_TO_RIGHT ... pliant vers la droite\n- DOUBLE_DOOR_FOLDING ... double porte pliante \n- REVOLVING ... porte tournante \n\
      - ROLLINGUP ... porte enroulable \n- SWING_FIXED_LEFT ... pivotant fixe à gauche \n- SWING_FIXED_RIGHT ... pivotant fixe à droite \n- USERDEFINED ... défini par l’utilisateur"
    it: "L’attributo «Tipo di operazione» è una tipizzazione standard per definire il tipo di vano. Ad es. \"SINGLE_SWING_LEFT\" \n\n- SINGLE_SWING_LEFT ... Anta battente sinistra per anta singola  \n-\
      \ SINGLE_SWING_RIGHT ... Anta battente destra per anta singola  \n- DOUBLE_DOOR_SINGLE_SWING ... Porta doppia battente ad anta singola \n- DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_LEFT ... Doppia porta battente\
      \ ad anta singola opposta a sinistra \n- DOUBLE_DOOR_SINGLE_SWING_OPPOSITE_RIGHT ... Doppia porta battente ad anta singola opposta a destra \n- DOUBLE_SWING_LEFT ... Porta doppio battente a sinistra\
      \ \n- DOUBLE_SWING_RIGHT ... Porta doppio battente a destra \n- DOUBLE_DOOR_DOUBLE_SWING ... Porta doppia a doppio battente \n- SLIDING_TO_LEFT ... Porta scorrevole a sinistra \n- SLIDING_TO_RIGHT\
      \ ... Porta scorrevole a destra \n- DOUBLE_DOOR_SLIDING ... Doppia porta scorrevole \n- FOLDING_TO_LEFT ... Porta pieghevole a sinistra \n- FOLDING_TO_RIGHT ... Porta pieghevole a destra \n- DOUBLE_DOOR_FOLDING\
      \ ... Doppia porta pieghevole \n- REVOLVING ... Porta girevole \n- ROLLINGUP ... Porta avvolgibile \n- SWING_FIXED_LEFT ...Battente con fissaggio a sinistra \n- SWING_FIXED_RIGHT ... Battente con\
      \ fissaggio a destra \n- USERDEFINED ... configurazione utente"
    en: ''
