definition:
  de: 'Aussenräume wie Balkone, Terrassen sowie der gesamte Planungsperimeter muss mit Räumen für bearbeitete (BUF) und unbearbeitete Umgebungsfläche (UUF) modelliert werden.


    **Modellierungshinweise:**

    - Der Aussenraum wird als Volumenkörper ausserhalb des Gebäudes mit einer Raumhöhe von 1m modelliert. 

    - Die Aussenräume repräsentieren bearbeitete oder unbearbeitete Umgebungsflächen in der Ausdehnung des Projektperimeter und sind nach den Raumtypen zu klassifizieren.

    - Bei Geländen im Gefälle ist der Aussenraum dennoch waagrecht zu modellieren.

    - Die bearbeiteten und unbearbeiteten Aussenräume sind dem EG (IfcBuildingStorey) zuzuweisen.

    - Balkone/Terrassen usw. sind im jeweiligen Geschoss (IfcBuildingStorey) zuzuweisen.'
  fr: "Les espaces extérieurs comme les balcons, les terrasses et l’ensemble du périmètre de planification doivent être modélisés avec des espaces (IfcSpace) pour une surface des abords aménagés (SAA) et\
    \ une surface des abords non aménagés (SAN) au rez-de-chaussée.   \n\n**Note pour la modélisation.**\n- L'espace extérieur est modélisé comme un volume d'une hauteur de 1m, extérieur au bâtiment\n-\
    \ Les espaces extérieurs représentent les surfaces des abords aménagés ou non aménagés dans l'étendue du périmètre du projet et sont à classer selon les types d'espaces. \n- Sur terrain en pente, l'espace\
    \ extérieur doit être modélisé en projection. \n- Les espaces extérieurs aménagés et non aménagés doivent être modélisés au rez-de-chaussée. \n- Les balcons/terrasses, etc. doivent être modélisés à\
    \ l'étage concerné."
  it: "Gli spazi esterni come balconi, terrazze e l’intero perimetro di pianificazione devono essere modellati con spazi di superficie libera esterna sistemata (SLES) e superficie libera esterna non sistemata\
    \ (SLEN). \n\n**Indicazioni per la modellazione.**\n - Lo spazio esterno è modellato come un solido esterno all’edificio con un’altezza di 1 m.  \n- Gli spazi esterni rappresentano spazi di superficie\
    \ libera esterna sistemata e superficie libera esterna non sistemata nell’ambito del perimetro di progetto e sono da classificare in base alla tipologia dei locali. \n- Su terreni in pendenza lo spazio\
    \ esterno deve essere comunque modellato in piano. \n- Gli spazi esterni sistemati e non devono essere attribuiti al piano terra (IfcBuildingStorey). \n- Balconi/terrazze ecc. devono essere attribuiti\
    \ al rispettivo piano (IfcBuildingStorey).projekt"
  en: ''
