definition:
  de: 'Klassifizierung für die Flächenberechnung gemäss SIA 416:2003 - Flächen und Volumen von Gebäuden.


    **Modellierungshinweis:**

    - Die modelierten Raum Elemente (ifcSpace) sind den SIA416 Zonen zuzuordnen und zu exportieren.'
  fr: "Classification pour le calcul de surfaces selon SIA 416:2003 - Surfaces et volumes de bâtiments.   \n\n**Note pour la modélisation.**\n- Les éléments de l'espace modélisé (ifcSpace) doivent être\
    \ affectés aux zones SIA416 et exportés."
  it: "Classificazione per il calcolo delle superfici secondo la norma SIA 416:2003 - Superfici e volumi di edifici.  \n\n**Indicazione per la modellazione.**\n- Gli elementi dello spazio modellati (ifcSpace)\
    \ devono essere assegnati alle zone SIA416 ed esportati."
  en: ''
