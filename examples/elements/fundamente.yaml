- name: ThermalTransmittance
  pset: Pset_FootingCommon
  definition:
    de: Waermedurchgangskoeffizient (U-Wert) eines Bauteils. Gibt an, wie viel Waerme pro Quadratmeter und Kelvin Temperaturdifferenz durch das Element uebertragen wird (W/m²K).
    fr: Coefficient de transmission thermique (valeur U) d’un element. Indique la quantite de chaleur transmise par metre carre et par Kelvin de difference de temperature (W/m²K).
    it: Coefficiente di trasmittanza termica (valore U) di un elemento. Indica la quantita di calore trasmessa per metro quadrato e per Kelvin di differenza di temperatura (W/m²K).
    en: ''
