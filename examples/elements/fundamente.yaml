- name: PredefinedType
  pset: null
  definition:
    de: 'Der PredefinedType definiert die Art des Fundaments genauer.


      PAD_FOOTING … Einzelfundament

      STRIP_FOOTING … Streifenfundament

      PILE_CAP … Pfahlkopfplatte

      FOOTING_BEAM … Fundamentbalken

      CAISSON_FOUNDATION … Senkkastenfundament'
    fr: 'Le PredefinedType definit plus precisement le type de fondation.


      PAD_FOOTING … Semelle isolee

      STRIP_FOOTING … Semelle filante

      PILE_CAP … Tete de pieu

      FOOTING_BEAM … Poutre de fondation

      CAISSON_FOUNDATION … Fondation par caisson'
    it: 'Il PredefinedType definisce in modo piu preciso il tipo di fondazione.


      PAD_FOOTING … Plinto isolato

      STRIP_FOOTING … Fondazione a trave continua

      PILE_CAP … Plinto su pali

      FOOTING_BEAM … Trave di fondazione

      CAISSON_FOUNDATION … Fondazione a cassone'
    en: ''
