- name: RelationToSystem
  pset: Cust_Element
  definition:
    de: Jedes gebäudetechnische Bauteil muss einem technischen System zugeordnet werden. Die Zuordnung stellt sicher, dass Funktionen, Abhängigkeiten und Verantwortlichkeiten eindeutig definiert sind und
      ermöglicht eine konsistente Auswertung über Planung, Ausführung und Betrieb hinweg.
    fr: Ogni componente tecnico dell’edificio deve essere assegnato a un sistema tecnico. Questa assegnazione garantisce una definizione chiara delle funzioni, delle dipendenze e delle responsabilità, e
      consente una valutazione coerente durante la pianificazione, l’esecuzione e la gestione operativa.
    it: Chaque élément technique du bâtiment doit être attribué à un système technique. Cette attribution garantit une définition claire des fonctions, des dépendances et des responsabilités, et permet
      une analyse cohérente tout au long de la planification, de l’exécution et de l’exploitation.
    en: ''
