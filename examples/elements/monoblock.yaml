definition:
  de: Ein Lüftungsmonoblock ist eine kompakte Einheit, die die Luft eines Gebäudes belüftet, indem sie alle Komponenten in einem einzigen Block integriert.
  fr: Un monobloc de ventilation est une unité compacte qui ventile l'air d'un bâtiment en intégrant tous les composants dans un seul bloc.
  it: Un monoblocco di ventilazione è un'unità compatta che ventila l'aria di un edificio integrando tutti i componenti in un unico blocco.
  en: ''
