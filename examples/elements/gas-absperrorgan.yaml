- name: Status
  pset: Cust_Infra
  definition:
    de: "Status des Bauteils insbesondere beim Bauen im Bestand. \n- New: \"Neu\" - neues Bauteil als Ergänzung\n- Existing: \"Bestand\" -  bestehendes Bauteil, dass erhalten bleibt\n- Demolish: \"Abbruch\"\
      \ - Bauteil, das abgebrochen wird\n- Temporary: \"Temporär\" -  Bauteil und andere Bauelemente, die vorübergehend eingebaut werden (wie Abstützungen, etc.)"
    fr: "Statut de l’élément de construction, notamment pour la construction dans l’existant.  \n- New : \"Nouveau\" - nouvel élément de construction en complément \n- Existing : \"Existant\" - élément\
      \ existant qui est maintenu \n- Demolish : \" Démolition \" - élément existant qui est démoli \n- Temporary : \"Temporaire\" - élément de construction et autres éléments qui sont intégrés provisoirement\
      \ (comme des étayages, etc.)"
    it: "Stato di un componente, in particolare per costruire nella sostanza edilizia esistente.  \n- New: \"Nuovo\" - nuovo componente come aggiunta \n- Existing: \"Esistente\" -  componente esistente\
      \ che viene mantenuto \n- Demolish: \"Demolizione\" - componente che viene demolito\n- Temporary: \"Temporaneo\" -  Componente e altri elementi costitutivi installati temporaneamente (come i supporti,\
      \ ecc.)"
    en: ''
