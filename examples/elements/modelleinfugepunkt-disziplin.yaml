definition:
  de: Jede Disziplin erstellt in Absprache mit dem BIM-Koordinator bzw. -Manager ein "Tortenstück". Die oberen Spitzen dieser Tortenstücke sind deckungsgleich mit dem Modelleinfügepunkt Bauwerk.
  fr: Chaque discipline crée une "part de gâteau" en concertation avec le coordinateur ou le manager BIM. Les pointes supérieures de ces parts coïncident avec le point d'insertion du modèle de l'ouvrage
  it: "In accordo con il coordinatore o il BIM manager, ogni disciplina realizza un grafico \"a torta\". \nLe punte superiori di queste fette di torta coincidono con il punto del modello opera di costruzione."
  en: ''
