- name: ElevationLN02
  pset: Cust_ModelInsertionPoint
  definition:
    de: 'Wird durch den Besteller geliefert, wobei die Höhe bei Bestandsgebäuden absolut bei der Haupteingangstür liegt.


      Bei einem Neubau wird dies im Rahmen der Phase 21 erarbeitet. Die Höhe wird in m angegeben, z.B. 563.13'
    fr: "Fourni par l’auteur de la commande, la hauteur étant mesurée au niveau de la porte de l’entrée principale pour les bâtiments existants.  \n\nDans le cas d’une construction neuve, cela est élaboré\
      \ dans le cadre de la phase 21. La hauteur est indiquée en m, p. ex. 563.13"
    it: "Fornito dal committente; per gli edifici esistenti l'altezza misurata alla porta d'ingresso principale.  \n\nPer un nuovo edificio questo sarà sviluppato come parte della fase 21. L'altezza è espressa\
      \ in m, ad es. 563.13"
    en: ''
