name:
  de: Architektur-Elementmodell
  fr: Maquette d'éléments d'architecture
  it: Modello elementi di architettura
  en: Architecture element model
definition:
  de: Projektspezifisches Teilmodell unter der Domain Architektur. Enthält architektonische Bauteile und Elemente (ohne reine Raum- oder Fassadeninhalte).
  fr: Maquette partielle spécifique au projet sous le domaine Architecture. Contient les éléments et composants architecturaux (hors contenus purement spatiaux ou de façade).
  it: Modello parziale specifico del progetto nel dominio Architettura. Contiene componenti ed elementi architettonici (esclusi contenuti puramente spaziali o di facciata).
  en: Project-specific partial model under the Architecture domain. Contains architectural building elements (excluding pure room or facade content).
